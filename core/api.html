<script type="text/x-red" data-help-name="hal2Api">
    <p>JSON-in / JSON-out gateway to the hal2 tool catalog. Wire it behind an
    <code>http in</code>, MQTT, or any node that produces a JSON message, to query
    device state and control devices over a simple request/response contract.</p>

    <h3>Input</h3>
    <p><code>msg.payload</code> = <code>{ "tool": "&lt;name&gt;", "args": { ... } }</code>.
    <code>msg.tool</code> / <code>msg.args</code> override the payload fields if present.
    Optional <code>msg.claims</code> is passed through to the tool (used for admin role checks).</p>
    <p><strong>The payload must be an object.</strong> In an <code>inject</code> node set the type to
    <code>{} JSON</code>, not <code>string</code> — a JSON <em>string</em> is auto-parsed as a fallback, but
    setting <code>msg.tool</code> directly always works regardless of payload type.</p>

    <h3>Output</h3>
    <p>The response envelope is written to the property configured in <strong>Property</strong>
    (<code>msg.payload</code> by default — can be any <code>msg</code> path, or a
    <code>flow</code>/<code>global</code> context key):<br>
    <code>{ "ok": true, "result": ... }</code> on success, or
    <code>{ "ok": false, "error": { "code", "message" } }</code> on failure.</p>

    <h3>Which tools</h3>
    <p>This node speaks for one endpoint, chosen with <strong>Standalone</strong>. Set to
    <code>none</code> it is the event handler's: the built-in catalogue plus every tool published to it by an
    <code>mcp-in</code> whose server runs in <b>embedded</b> mode. Pick a <b>standalone</b> MCP
    server and you get that server's tools and nothing else &mdash; <code>get_state</code> answers
    <em>Unknown tool</em> there, exactly as it does for an MCP client on that URL. A flow needing
    both uses two of these nodes.</p>

    <p>Send <code>{ "list": true }</code> (or <code>msg.list = true</code>) instead of a tool name
    to get the catalogue behind this node: <code>{ name, description, inputSchema }</code> per tool,
    the same shape an MCP client receives.</p>

    <p><strong>Tool access does not apply here.</strong> The claim and scope gates run on the MCP
    route, where the token behind them was verified; a flow node is already inside the trust
    boundary, since editing flows is full control either way. So a tool restricted to certain
    callers over MCP is still callable from a flow, and the listing above shows it. Admin tools are
    the exception: they need <strong>Allow admin tools</strong> <em>and</em> an admin claim on
    <code>msg.claims</code>.</p>

    <h3>Tools</h3>
    <p>The available tools and their arguments mirror the MCP catalog and are documented in
    <a href="https://github.com/flic/node-red-contrib-hal2/blob/main/docs/API.md" target="_blank">docs/API.md</a>
    (auto-generated on GitHub). Read tools (e.g. <code>get_all_states</code>, <code>get_state</code>,
    <code>get_history</code>, <code>get_scenes</code>, <code>get_presence</code>, <code>get_alerts</code>)
    and control tools (e.g. <code>set_light</code>, <code>control_cover</code>, <code>control_climate</code>,
    <code>activate_scene</code>) are always available. Admin tools require <strong>Allow admin tools</strong>.</p>

    <li><strong>Event handler</strong>: the hal2EventHandler whose devices this API serves.</li>
    <li><strong>Standalone</strong>: an MCP server node whose tools this node exposes instead. <code>none</code> = the event handler's own endpoint.</li>
    <li><strong>Property</strong>: message property or context key the response envelope is written to (default <code>msg.payload</code>).</li>
    <li><strong>Allow admin tools</strong>: expose <code>get_flow</code> / <code>deploy_flow</code> through this node.</li>
</script>

<script type="text/javascript">
    RED.nodes.registerType('hal2Api', {
        category: 'Home Automation',
        color: '#b3b3ff',
        defaults: {
            eventHandler: {
                value: "Event handler",
                type: "hal2EventHandler",
                required: true
            },
            mcpServer:       { value: "", type: "hal2MCPServer", required: false },
            name:            {},
            allowAdminTools: { value: false },
            field:           { value: "payload" },
            fieldType:       { value: "msg" }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-exchange",
        label: function() {
            return this.name || "api";
        },
        paletteLabel: "api",
        oneditprepare: function() {
            // Nodes deployed before the Output field existed have no saved
            // field/fieldType — default them so typedInput doesn't init empty.
            if (!$("#node-input-field").val())     { $("#node-input-field").val("payload"); }
            if (!$("#node-input-fieldType").val()) { $("#node-input-fieldType").val("msg"); }
            $("#node-input-field").typedInput({
                types: ['msg', 'flow', 'global'],
                typeField: $("#node-input-fieldType")
            });
        }
    });
</script>
