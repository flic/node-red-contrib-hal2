<script type="text/x-red" data-template-name="hal2Event">
    <div class="form-row" id="div-error" hidden>
        <p>No items found. Start by creating some Things.</p>
    </div>

    <div class="form-row" id="div-main">
        <div class="form-row">
            <label for="node-input-eventHandler"><i class="fa fa-ellipsis-h"></i> Event handler</label>
            <input type="text" id="node-input-eventHandler" style="width:calc(100% - 127px)" placeholder="Event handler">
        </div>

        <div class="form-row">
            <label for="node-input-typeSel"><i class="fa fa-folder"></i> Category</label>
            <select id="node-input-typeSel" style="width:calc(100% - 170px)">
                <option value='hal2Thing'>Thing</option>
                <option value='hal2Group'>Group</option>
                <option value='hal2ThingType'>Type</option>
            </select>
        </div>

        <div class="form-row">
            <label for="node-input-thing" id="label-node-input-thing"><i class="fa fa-microchip"></i> Thing</label>
            <select id="node-input-thing" style="width:calc(100% - 170px)"></select>
            <button id="thing-filter-button"><i class="fa fa-filter"></i></button>
        </div>

        <div class="form-row" id="row-group-function">
            <label for="node-input-groupFunction"><i class="fa fa-calculator"></i> Value</label>
            <select id="node-input-groupFunction" style="width:calc(100% - 170px)"></select>
        </div>

        <div class="form-tips" id="row-group-tip" style="margin-left:105px; width:calc(100% - 170px); max-width:none; box-sizing:border-box; margin-bottom:8px;">
            <small id="group-tip"></small>
        </div>

        <div class="form-row" id="thing-filter-div" hidden>
            <label for="thing-filter" id="label-thing-filter"><i class="fa fa-filter"></i> Filter</label>
            <select id="thing-filter" style="width:calc(100% - 170px)"></select>
        </div>

        <div class="form-row" id="row-notes" style="width:100%" hidden>
            <label for="thing-notes"><i class="fa fa-file"></i> Notes</label>
            <textarea id="thing-notes" style="width:calc(100% - 170px);background-color:#ffe;"></textarea>
        </div>

        <div class="form-row" id="div-item">
            <label for="node-input-item"><i class="fa fa-sitemap"></i> Item</label>
            <select id="node-input-item" style="width:calc(100% - 170px)"></select>
        </div>

        <div class="form-row" id="row-item-notes" style="width:100%" hidden>
            <label for="item-notes"><i class="fa fa-file"></i> Notes</label>
            <textarea id="item-notes" style="width:calc(100% - 170px);background-color:#ffe;"></textarea>
        </div>

        <div class="form-row">
            <label for="node-input-operator"><i class="fa fa-play-circle"></i> Trigger</label>
            <select id="node-input-operator" style="width:calc(100% - 170px)"></select>
            <input type="text" id="node-input-compareValue" style="width:calc(100% - 219px)>
            <input type="hidden" id="node-input-compareType">
        </div>

        <div class="form-row" id="row-compare-source" hidden>
            <label for="node-input-compareThing"><i class="fa fa-sitemap"></i> Compare</label>
            <select id="node-input-compareThing" style="width:calc(100% - 170px)"></select>
        </div>

        <div class="form-row" id="row-compare-item" hidden>
            <label for="node-input-compareItem" id="label-compare-item"><i class="fa fa-sitemap"></i> Item</label>
            <select id="node-input-compareItem" style="width:calc(100% - 170px)"></select>
            <select id="node-input-compareFn" style="width:calc(100% - 170px)"></select>
        </div>

        <div class="form-tips" id="row-compare-tip" style="margin-left:105px; width:calc(100% - 170px); max-width:none; box-sizing:border-box; margin-bottom:8px;" hidden>
            <small id="compare-tip"></small>
        </div>

        <div class="form-row">
            <label></label>
            <select id="node-input-change" style="width:calc(100% - 170px)"></select>
        </div>

        <div class="form-row">
            <label for="node-input-outputValue"><i class="fa fa-sign-out"></i> Output</label>
            <input type="text" id="node-input-outputValue" style="width:calc(100% - 170px)">
            <input type="hidden" id="node-input-outputType">
        </div>

        <div class="form-tips" id="row-always-tip" style="margin-left:105px; width:calc(100% - 170px); max-width:none; box-sizing:border-box; margin-bottom:8px;" hidden>
            <small>With <b>always</b> the rule never stops holding, so this node will only ever send
            <code>true</code> &mdash; one per event the change setting lets through, never a
            <code>false</code>.</small>
        </div>

        <div class="form-row" id="row-ratelimit">
            <label></label>
            <input type="checkbox" id="node-input-ratelimit" style="width: 23px; margin:0"> Rate limit
        </div>
        <div class="form-row">
            <label></label>
            <input type="checkbox" id="node-input-delay" style="width: 23px; margin:0"><label for="node-input-delay" style="margin:0;width: auto;"> Delay event</label>
        </div>

        <div id="ratelimit-details" hidden>
            <!-- A flex row rather than a width budget: jQuery's .spinner() wraps the number
                 field in its own container and adds arrow buttons, so the field is wider than
                 the 53px the select's calc() used to subtract for, and the row wrapped. Here
                 nothing has to predict the spinner's width. -->
            <div class="form-row" style="display:flex; align-items:center;">
                <label for="node-input-rateUnits" style="flex:0 0 auto;"><i class="fa fa-clock-o"></i> Rate limit</label>
                <span style="flex:0 0 auto; margin-right:6px;">1 event per</span>
                <span style="flex:0 0 auto;"><input type="text" id="node-input-rate" placeholder="1" style="width:53px" value=1></span>
                <select id="node-input-rateUnits" style="flex:1 1 0; min-width:0; margin-left:6px;">
                  <option value="second">Second(s)</option>
                  <option value="minute">Minute(s)</option>
                  <option value="hour" selected>Hour(s)</option>
                  <option value="day">Day(s)</option>
                </select>
            </div>
            <div class="form-row" id="rate-type" hidden>
                <label></label>
                <select id="node-input-ratetype" style="width:calc(100% - 170px)">
                    <option value="all" selected>All events</option>
                    <option value="item">For each item</option>
                </select>
            </div>
        </div>

        <div id="delay-details" hidden>
            <div class="form-row">
                <label for="node-input-delayValue"><i class="fa fa-pause-circle-o"></i> Delay event</label>
                <input type="text" id="node-input-delayValue" placeholder="5" style="width:70px" value=5> second(s)
            </div>
            <div class="form-row">
                <label></label>
                <input type="checkbox" id="node-input-delayExtend" style="width: 23px; margin:0"><label for="node-input-ratelimit" style="margin:0;width: auto;"> Extend delay if new event arrives</label>
            </div>
            <div class="form-row" id="row-delay-on-true">
                <label></label>
                <input type="checkbox" id="node-input-delayOnTrue" style="width: 23px; margin:0"><label for="node-input-delayOnTrue" style="margin:0;width: auto;"> Delay on true</label>
            </div>
            <div class="form-row" id="row-delay-on-false">
                <label></label>
                <input type="checkbox" id="node-input-delayOnFalse" style="width: 23px; margin:0"><label for="node-input-delayOnFalse" style="margin:0;width: auto;"> Delay on false</label>
            </div>
            <div class="form-row" id="row-delay-reset">
                <label></label>
                <input type="checkbox" id="node-input-delayReset" style="width: 23px; margin:0"><label for="node-input-ratelimit" style="margin:0;width: auto;"> Reset delay if trigger no longer true</label>
            </div>
        </div>


        <div class="form-row">
            <label for="node-input-topic"><i class="fa fa-tasks"></i> Topic</label>
            <input type="text" id="node-input-topic" placeholder="Topic" style="width:calc(100% - 170px)">
        </div>        

        <div class="form-row">
            <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
            <input type="text" id="node-input-name" placeholder="Name" style="width:calc(100% - 170px)">
        </div>
    </div>
</script>

<script type="text/x-red" data-help-name="hal2Event">
    <p>The Event node is used to initiate a flow when certain <i>Item</i> conditions are met.</p>
    <li><strong>Event handler</strong>: Used for firing events between nodes. Use the same config for all nodes that should be able to communicate.</li>
    <li><strong>Category</strong>: A <i>Thing</i> watches one Item, a <i>Type</i> watches the same Item across every Thing of that type, and a <i>Group</i> watches the group's own value. Only groups that have been given a <b>Value</b> on the Event handler's Groups tab can be watched — a command-only group has nothing to observe.</li>
    <li><strong>Item/Trigger</strong>: Select which <i>Item</i> and what conditions are to be met for the event to trigger. For a group the group <em>is</em> the item: it carries one aggregated value, and the trigger compares that. <code>msg.member</code> tells you which member moved it.</li>
    <li><strong>on change/on update</strong>: If <em>on change</em> is selected the event only triggers if the value really changed, <em>on update</em> triggers every time the value is updated even if the value itself stays the same. <em>on change (ignore initial value)</em> is <em>on change</em> that additionally stays quiet for an item's very first value.</li>
    <li><strong>Output</strong>: Select what value the node should be sending on to the next node when triggered. If <i>event msg</i> is selected, the <i>Item state</i> value is sent. The <code>msg.thing</code>, <code>msg.item</code> and <code>msg.topic</code> from the <i>Thing</i> node is always added to the outgoing <code>msg</code>.</li>
    <li><strong>trigger true/false</strong>: reports the trigger as a <em>level</em> rather than an event &mdash; <code>true</code> when the rule starts holding, <code>false</code> when it stops, and nothing in between however many updates arrive. A threshold whose reading wanders without crossing it stays silent.
        <ul>
            <li><b>Rate limit does not apply</b> and is hidden. It drops messages inside its window, and a dropped <code>false</code> would leave the receiver believing <code>true</code> indefinitely &mdash; not a degraded signal but a wrong one.</li>
            <li><b>Delay applies per edge</b>: <i>Delay on true</i> and <i>Delay on false</i> decide which one waits. With only the first (the default) the rule must hold for the delay before <code>true</code> is sent while <code>false</code> goes out at once; with only the second the node reacts immediately but is slow to let go &mdash; useful for a signal that flickers off. A queued edge is dropped whenever the answer moves away from it again, so the node never announces a state that has already stopped being true. <i>Reset delay</i> is therefore implied, and hidden.</li>
            <li><b>With <i>always</i></b> the rule never stops holding, so there is no level. The node then behaves as it always has and simply carries <code>true</code>: one per event the change setting lets through, never a <code>false</code>.</li>
        </ul>
    </li>
    <li><strong>Topic</strong>: <code>msg.topic</code>, leave blank to get topic from <i>Item</i>.</li>
    <li><strong>Name</strong>: Node name.</li>    
</script>

<script type="text/javascript">
    RED.nodes.registerType('hal2Event',{
        category: 'Home Automation',
        color: '#b3b3ff',
        defaults: {
            eventHandler: {
                value: "Event handler",
                type: "hal2EventHandler",
                required: true
            },
            name:           {},
            topic:          { value:"" },
            thing:          { value: "", required: true },
            typeSel:        {},
            groupFunction:  { value: '' },
            item:           { value: "", required: true },
            operator:       { value: "", required: true },
            change:         { value: "1" },
            compareValue:   { value: "" },
            compareType:    { value: "num" },
            compareSource:  { value: null },
            outputValue:    { value: "" },
            outputType:     { required: true },
            ratelimit:      { value: false },
            ratetype:       { value:"all"},
            rate:           { value:"1" },
            rateUnits:      { value:"hour" },
            delay:          { value: false },
            delayExtend:    { value: false },
            delayOnTrue:    { value: true },
            delayOnFalse:   { value: false },
            delayReset:     { value: false },
            delayValue:     { value: 5 }
        },
        inputs:0,
        outputs:1,
        icon: "event.png",
        label: function() {
            return this.name||"event";
        },
        paletteLabel: "event",
        oneditprepare: async function () {
            // Assigned further down, once the compare field exists; the operator handler and the
            // value's own change event both call it so one rule decides the row's visibility.
            var syncCompareRow = function() {};
            // The editor's copy of core/event.js's levelMode. A level exists only when the rule
            // can stop holding, so 'always' is not one: it keeps its rate limit and its delay
            // reset, and gets a note instead. Either field can flip this, so both call it.
            function syncOutputMode() {
                var isTrigger = $('#node-input-outputValue').typedInput('type') === 'trigger';
                var always    = $("#node-input-operator").val() === 'always';
                var levelMode = isTrigger && !always;
                $("#row-ratelimit").toggle(!levelMode);
                $("#ratelimit-details").toggle(!levelMode && $("#node-input-ratelimit").is(':checked'));
                $("#row-delay-reset").toggle(!levelMode);
                // Which edge the delay applies to is a question only a level can be asked.
                // Everywhere else there is one edge, and delayReset covers it.
                $("#row-delay-on-true").toggle(levelMode);
                $("#row-delay-on-false").toggle(levelMode);
                $("#row-always-tip").toggle(isTrigger && always);
            }
            var operators = halOperators([{ v: "always", t: "always"}]);

            var groupsList = halGetGroups(RED, $("#node-input-eventHandler").val(), 'value');

            // Check if the source has been deleted. A group is not a node — its id lives in the
            // Event handler's registry — so looking it up with RED.nodes.node() finds nothing and
            // would wipe a perfectly good configuration every time the dialog opened.
            if (this.thing != 0) {
                try {
                    var stillThere = (this.typeSel === 'hal2Group')
                        ? groupsList.some(function(g) { return g.id === this.thing; }, this)
                        : typeof RED.nodes.node(this.thing) !== 'undefined';
                    if (!stillThere) {
                        console.error((this.typeSel === 'hal2Group' ? 'Group ' : 'Thing ') + this.thing +
                                      ' is missing (or no longer has a value).');
                        this.thing = void 0;
                        this.item = void 0;
                        this.typeSel = void 0;
                    }
                } catch (error) {
                        console.log('Error: '+error.message);
                }  
            }

            var savedThing = this.thing;
            var savedItem = this.item;
            var savedTypeSel = this.typeSel;
            var savedFunction = this.groupFunction || '';
            var groupHaType = null, groupStray = false;
            // The picker stays short; what the chosen function means is said once, here.
            function syncFunctionTip(show) {
                $("#group-tip").text(!show ? '' : halGroupFunctionTip(
                    groupHaType, $("#node-input-groupFunction").val(), groupStray,
                    'The saved function does not fit this group\'s members — this node will never fire.'));
                $("#row-group-tip").toggle(!!show);
            }
            $("#node-input-groupFunction").change(function() { syncFunctionTip(true); });

            //get all things and sort them alphabetically
            var thingsList = halGetThings(RED,'status');
            if (thingsList.length == 0) {
                $("#div-main").hide();
                $("#div-error").show();
                return;
            }  
            var thingTypeList = halGetThingTypes(RED,thingsList,true);

            $('#node-input-rate').spinner({
                min:1,
                change: function(event, ui) {
                    var value = this.value;
                    if (!value.match(/^\d+$/)) { value = 1;  }
                    else if (value < this.min) { value = this.min; }
                    if (value !== this.value) { $(this).spinner("value", value); }
                }
            });

            $("#node-input-typeSel").change( function() {
                var nodeType = $("#node-input-typeSel").val();
                switch (nodeType) {
                    case "hal2Thing":
                        //Add things
                        $("#rate-type").hide();
                        $("#div-item").show();
                        $("#label-node-input-thing").text(" Thing");
                        $("#label-node-input-thing").attr('class','fa fa-microchip');
                        $("#thing-filter-button").show();
                        $("#thing-filter-div").hide();
                        $("#node-input-thing").children().remove();
                        for (var t in thingsList) {
                            $("<option value='" + thingsList[t].id + "'> " + thingsList[t].name + "</option>").appendTo("#node-input-thing");
                        }
                        if ((typeof savedTypeSel != 'undefined') && (savedTypeSel == 'hal2Thing')) {
                            $("#node-input-thing").val(savedThing);
                        }
                        $("#node-input-thing").trigger('change');
                        break;
                    case "hal2Group":
                        //Add groups
                        $("#rate-type").hide();
                        $("#div-item").hide();
                        $("#row-notes").hide();
                        $("#row-item-notes").hide();
                        $("#label-node-input-thing").text(" Group");
                        $("#label-node-input-thing").attr('class','fa fa-object-group');
                        $("#thing-filter-button").hide();
                        $("#thing-filter-div").hide();
                        $("#node-input-thing").children().remove();
                        if (groupsList.length === 0) {
                            // Say why rather than showing an empty box: a group is only
                            // offered here once it has been given a Value.
                            $("<option value=''>- no groups with a value -</option>").appendTo("#node-input-thing");
                        }
                        for (let d in groupsList) {
                            $("<option value='" + groupsList[d].id + "'>" + groupsList[d].name + "</option>").appendTo("#node-input-thing");
                        }
                        if ((typeof savedTypeSel != 'undefined') && (savedTypeSel == 'hal2Group')) {
                            $("#node-input-thing").val(savedThing);
                        }
                        $("#node-input-thing").trigger('change');
                        break;
                    case "hal2ThingType":
                        //Add groups
                        $("#rate-type").show();
                        $("#div-item").show();
                        $("#label-node-input-thing").text(" Type");
                        $("#label-node-input-thing").attr('class','fa fa-gears');
                        $("#thing-filter-button").hide();
                        $("#thing-filter-div").hide();
                        $("#row-notes").hide();
                        $("#node-input-thing").children().remove();
                        for (let d in thingTypeList) {
                            $("<option value='" + thingTypeList[d].id + "'>" + thingTypeList[d].name + "</option>").appendTo("#node-input-thing");
                        }
                        if ((typeof savedTypeSel != 'undefined') && (savedTypeSel == 'hal2ThingType')) {
                            $("#node-input-thing").val(savedThing);
                        }
                        $("#node-input-thing").trigger('change');
                        break;
                }                      
            });

            $("#thing-filter").change(function() {
                $("#node-input-thing").children().remove();
                for (var d in thingsList) {
                    if (($("#thing-filter").val() == 0) || (thingsList[d].thingType == $("#thing-filter").val())) {
                        $("#node-input-thing").append($("<option></option>").val(thingsList[d].id).text(thingsList[d].name));
                    }
                }
                $("#node-input-thing").trigger('change');
            });

            $("#thing-filter-button").on('click', function() {
                        if ($("#thing-filter-div").is(':visible')) {
                            $("#thing-filter-div").hide();
                            if ($("#thing-filter").val() != 0) {
                                $("#thing-filter").val(0);
                                $("#thing-filter").trigger('change');
                            }
                        } else {
                            $("#thing-filter-div").show();
                        }
                    });

            $("#node-input-thing").change(function() {
                $("#node-input-item").children().remove();

                // Groups are not nodes — the item field carries the group id.
                if ($("#node-input-typeSel").val() == 'hal2Group') {
                    $("#div-item").hide();
                    $("#row-notes").hide();
                    $("#row-item-notes").hide();
                    var gid = $("#node-input-thing").val();
                    if (gid) {
                        $("<option value='" + gid + "'>" + gid + "</option>").appendTo("#node-input-item");
                        $("#node-input-item").val(gid);
                    }
                    var g = groupsList.filter(function(x) { return x.id === gid; })[0];
                    // The current pick if there is one, so changing group does not throw away
                    // a function you just chose.
                    var stray = halFillGroupFunctions($("#node-input-groupFunction"), g && g.haType,
                                                      $("#node-input-groupFunction").val() || savedFunction);
                    $("#row-group-function").toggle(!!g);
                    groupHaType = g && g.haType;
                    groupStray  = stray;
                    syncFunctionTip(!!g);
                    return;
                }
                $("#row-group-tip").hide();
                $("#row-group-function").hide();

                let thing = RED.nodes.node($("#node-input-thing").val());
                if (typeof thing === 'undefined') { return }

                if (thing.type == "hal2Thing") {
                    $("#div-item").show();
                    // Show notes
                    if (thing.notes) {
                        $("#row-notes").show();
                        $("#thing-notes").val(thing.notes);
                    } else {
                        $("#row-notes").hide();
                    }
                    //get all items and sort them alphabetically
                    var thingType;
                    try {
                        thingType = RED.nodes.node(thing.thingType);
                    } catch (error) {
                        console.log('Error: '+error.message);
                    }
                    //Add items
                    for (let d in thingType.items) {
                        if (halStatusItem(thingType.items[d])) {
                            $("<option value='" + thingType.items[d].id + "'> " + thingType.items[d].name + "</option>").appendTo("#node-input-item");
                        }
                    }
                    if ($("#node-input-thing").val() == savedThing) {
                        $("#node-input-item").val(savedItem);
                    }
                    $("#node-input-item").trigger('change');
                } else if (thing.type == "hal2Group") {
                    $("#div-item").hide();
                    $("<option value='" + thing.id + "'> " + thing.name + "</option>").appendTo("#node-input-item");
                    $("#node-input-item").val(thing.id)
                } else if (thing.type == "hal2ThingType") {
                    $("#div-item").show();  
                    //get all items and sort them alphabetically
                    let thingType = RED.nodes.node($("#node-input-thing").val());

                    //Add items
                    for (let d in thingType.items) {
                        if (thingType.items[d].type != 'command') {
                            $("<option value='" + thingType.items[d].id + "'> " + thingType.items[d].name + "</option>").appendTo("#node-input-item");
                        }
                    }

                    if ($("#node-input-thing").val() == savedThing) {
                        $("#node-input-item").val(savedItem);
                    }
                    $("#node-input-item").trigger('change');
                }
            });

            $("#node-input-item").change(function() {
                $("#row-item-notes").hide();
                if ($("#node-input-thing").val() == null) { return; }
                if ($("#node-input-typeSel").val() == 'hal2Group') { return; }
                if ($("#node-input-typeSel").val() == 'hal2ThingType') {
                    var thingType = RED.nodes.node($("#node-input-thing").val());
                } else {
                    var thing = RED.nodes.node($("#node-input-thing").val());
                    var thingType = RED.nodes.node(thing.thingType);
                }
                var item = $("#node-input-item").val();
                for (let d in thingType.items) {
                    if (thingType.items[d].id == item) {
                        if (thingType.items[d].notes) {
                            $("#row-item-notes").show();
                            $("#item-notes").val(thingType.items[d].notes);
                        }
                        break;
                    }
                }                                     
            });

            $("#node-input-ratelimit").change( function () {
                if ($("#node-input-ratelimit").is(":checked")) {
                    syncOutputMode();
                } else {
                    $("#ratelimit-details").hide();
                }
            });
            $("#node-input-delay").change( function () {
                if ($("#node-input-delay").is(":checked")) {
                    $("#delay-details").show();
                } else {
                    $("#delay-details").hide();
                }
            });

            //Add filter types
            $("#thing-filter").append($("<option></option>").val(0).text("<All types>"));
            for (let d in thingTypeList) {
                $("#thing-filter").append($("<option></option>").val(thingTypeList[d].id).text(thingTypeList[d].name));
            }   

            // Add values
            if (this.thing) {
                $("#node-input-typeSel").val(this.typeSel);
                $("#node-input-thing").val(this.thing);
            } else {
                $("#node-input-typeSel").val('hal2Thing');
            }

            $("#node-input-typeSel").trigger('change');
            $('#node-input-thing').trigger('change');

            //Add operators
            for (var d in operators) {
                $("<option value='" + operators[d].v + "'> " + operators[d].t + "</option>").appendTo("#node-input-operator");
            }
            if (this.operator) {
                $("#node-input-operator").val(this.operator);
                $('#node-input-operator').trigger('change');
            } else {
                $("#node-input-operator").val(operators[0].v);
                $('#node-input-operator').trigger('change');  
            }
            //Add comparison value
            $('#node-input-compareValue').typedInput({
                default: 'num',
                typeField: $("#node-input-compareType"),
                types: ['str','num','json',halTypeState()]
            });

            // Comparing against another live reading rather than a constant. Both sides are
            // read when the event fires, so they cannot disagree because one was stored earlier.
            var syncCompareSource = halFillSourcePicker(
                $("#node-input-compareThing"), $("#node-input-compareItem"), $("#node-input-compareFn"),
                thingsList, groupsList, this.compareSource,
                function(text) {
                    $("#compare-tip").text(text);
                    $("#row-compare-tip").toggle(!!text && $("#row-compare-source").is(':visible'));
                });
            $("#node-input-compareThing").change(function() {
                // The same word the primary picker uses for the same thing: a group is read
                // through a Value, a thing through an Item.
                var isGroup = ($("#node-input-compareThing").val() || '').indexOf('g:') === 0;
                $("#label-compare-item").text(isGroup ? ' Value' : ' Item')
                    .attr('class', isGroup ? 'fa fa-calculator' : 'fa fa-sitemap');
                syncCompareSource();
            });
            $("#node-input-compareThing").trigger('change');
            syncCompareRow = function() {
                var op = $("#node-input-operator").val();
                var takesValue = op !== 'always' && op !== 'true' && op !== 'false';
                var on = takesValue && $('#node-input-compareValue').typedInput('type') === 'state';
                $("#row-compare-source").toggle(on);
                $("#row-compare-item").toggle(on);
                $("#row-compare-tip").toggle(on && !!$("#compare-tip").text());
            };
            $('#node-input-compareValue').on('change', syncCompareRow);
            // The type is restored even when there is no value to restore: `state` carries none
            // (hasValue:false), so gating this on compareValue would load every saved state
            // comparison back as whatever type the field happened to default to.
            $("#node-input-compareValue").typedInput('value', this.compareValue || '');
            if (this.compareType) { $("#node-input-compareValue").typedInput('type', this.compareType); }

            //On change, update
            $("<option value='0'>on update</option>").appendTo("#node-input-change");
            $("<option value='1'>on change</option>").appendTo("#node-input-change");
            $("<option value='2'>on change (ignore initial value)</option>").appendTo("#node-input-change");


            $("#node-input-change").val(this.change);
            $('#node-input-change').trigger('change');  

            //Add output
            var stateType = {
                value: "state",
                label: "event msg",
                hasValue: false
            };
            // The level output: true while the trigger holds, false when it stops.
            var triggerType = {
                value: "trigger",
                label: "trigger true/false",
                hasValue: false
            };
            $('#node-input-outputValue').typedInput({
                default: 'state',
                typeField: $("#node-input-outputType"),
                types: [stateType,triggerType,'flow','global','env','str','num','bool','json']
            });
            if (this.outputType) {
                $("#node-input-outputValue").typedInput('type',this.outputType);
            }
            if (this.outputValue) {
                if (typeof this.outputValue == 'object') {
                        this.outputValue = JSON.stringify(this.outputValue);
                    }
                $("#node-input-outputValue").typedInput('value',this.outputValue);
            } else {
                $("#node-input-outputValue").typedInput('value','payload');
 
            }
            $('#node-input-outputValue').on('change', syncOutputMode);
            $("#node-input-operator").change(syncOutputMode);
            // Both details blocks are `hidden` in the markup and were only ever revealed by the
            // user ticking the box, so reopening a node that already had them on showed a ticked
            // box above a collapsed section. syncOutputMode settles the rate limit one; the delay
            // one needs its own nudge.
            syncOutputMode();
            $("#node-input-delay").trigger('change');

            //Show/Hide value field
            $("#node-input-operator").change( function() {
                var type = $("#node-input-operator").children("option:selected").val();
                if (type.length < 4) {
                    $("#node-input-operator").css({ "width": "50px" });
                    $("#node-input-compareValue").typedInput('width','calc(100% - 225px)')
                } else {
                    $("#node-input-operator").css({ "width": "90px" });
                    $("#node-input-compareValue").typedInput('width','calc(100% - 265px)')

                }
                if (type == "always" || type === "true" || type === "false") {
                    $("#node-input-compareValue").typedInput('hide');
                    $("#node-input-operator").css({ "width":"calc(100% - 170px)" });
                } else {
                    $("#node-input-compareValue").typedInput('show');
                }
                if (type == "regex" || type == "lt" || type == "lte" || type == "gt" || type == "gte") {
                    if (type == "regex") {
                        $('#node-input-compareValue').typedInput('types',['re']);
                        $('#node-input-compareValue').typedInput('type','re');
                    } else {
                        $('#node-input-compareValue').typedInput('types',['num',halTypeState()]);
                        if ($('#node-input-compareValue').typedInput('type') !== 'state') {
                            $('#node-input-compareValue').typedInput('type','num');
                        }
                    }
                } else {
                    $('#node-input-compareValue').typedInput('types',['str','num','json',halTypeState()]);
                }
                syncCompareRow();
            });
        },
        oneditsave: function () {
            this.typeSel = $("#node-input-typeSel").val();
            this.thing =   $("#node-input-thing").val();
            this.compareType = $('#node-input-compareValue').typedInput('type');
            this.compareValue =  $('#node-input-compareValue').typedInput('value');
            this.compareSource = this.compareType === 'state'
                ? halReadSourcePicker($("#node-input-compareThing"),
                                      $("#node-input-compareItem"),
                                      $("#node-input-compareFn"))
                : null;
        }
    });
</script>
