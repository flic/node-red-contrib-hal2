<script type="text/javascript" src="resources/node-red-contrib-hal2/hal.js"></script>

<script type="text/x-red" data-template-name="hal2Gate">
    <div class="form-row">
        <label for="node-input-name" style="width:95px; padding-right:10px;"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" style="width:calc(100% - 170px)">
    </div>
    <div class="form-row">
        <label for="node-input-eventHandler" style="width:95px; padding-right:10px;"><i class="fa fa-ellipsis-h"></i> Event handler</label>
        <input type="text" id="node-input-eventHandler" style="width:calc(100% - 170px)" placeholder="Event handler">
    </div>
    <div class="form-tips" style="margin-left:105px; width:calc(100% - 170px); box-sizing:border-box; margin-bottom:8px;">
        <small>Only needed when a rule reads a <b>Group</b> &mdash; pick the Event handler that owns it.</small>
    </div>
    <div class="form-row">
        <ol id="node-input-rule-container"</ol>
    </div>
    <div class="form-row">
        <select id="node-input-checkall" style="width:calc(100% - 65px)">
            <option value="true">all rules must be true</option>
            <option value="false">minimum one rule must be true</option>
        </select>
    </div>
    <div class="form-row">
        <input type="checkbox" id="node-input-if" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-if" style="width:165px">Set msg.payload to result</label>
    </div>

</script>

<script type="text/x-red" data-help-name="hal2Gate">
    <p>The Gate node is used to redirect the flow depending on if certain <i>Item</i> conditions are met.</p>
    <li><strong>Name</strong>: Node name.</li> 
    <li><strong>Event handler</strong>: Only needed when a rule reads a <i>Group</i>; it is where group values live.</li>
    <li><strong>Rules</strong>: Add one or more conditions to be met. A rule's source can be a Thing, a Thing set by <code>msg.thing.id</code>, or a <i>Group</i> that has been given a <b>Value</b> on the Event handler's Groups tab. A group carries one aggregated value, so it needs no Item.</li>
    <li><strong>No value</strong>: A rule whose source cannot be read — a missing Thing, or a group where no live member is reporting — does not match, rather than comparing against a stale or invented value.</li>
    <li><strong>TSU</strong>: Time since last update (in seconds)</li>
    <li><strong>TSC</strong>: Time since last change (in seconds)</li>
    <li><strong>Set <code>msg.payload</code> to result</strong>: Sends true or false.</li>
</script>

<script type="text/javascript">
    RED.nodes.registerType('hal2Gate',{
        category: 'Home Automation',
        color: '#b3b3ff',
        defaults: {
            name:       {},
            // Optional: only a Group rule needs it, and requiring it would flag every
            // existing Gate node as invalid.
            eventHandler: {
                value: "", type: "hal2EventHandler", required: false,
                // Needed only once a rule reads a group. Rules are harvested on save, so this
                // judges the saved ruleset — a group rule added and left without a handler is
                // flagged as soon as the dialog closes.
                validate: function (v) {
                    var needed = (this.rules || []).some(function (r) { return r && r.category === 'hal2Group'; });
                    return !needed || (!!v && v !== '_ADD_');
                }
            },
            rules:      {},
            checkall:   { value: "true" },
            if:         {},
            outputs:    {} // Store number of outputs
        },
        inputs:1,
        outputs:2,
        outputLabels: ["open","closed"],
        icon: "gate.png",
        label: function() {
            return this.name||"gate";
        },
        paletteLabel: "gate",
        oneditprepare: function () {
            var operators = halOperators([
                { v: "last_update_gte", t: "TSU >=" },
                { v: "last_update_lte", t: "TSU <=" },
                { v: "last_change_gte", t: "TSC >=" },
                { v: "last_change_lte", t: "TSC <=" }
            ]);

            var thingsList = halGetThings(RED,'status');
            var groupsList = halGetGroups(RED, $("#node-input-eventHandler").val(), 'value');
            // Membership test for the rule rows: a group id is not a node, so this is the
            // only way to tell the two kinds of entry in the source select apart.
            var groupIds = {};
            for (var gi in groupsList) { groupIds[groupsList[gi].id] = true; }
            //No thing nodes have been created
            if(thingsList.length===0 && groupsList.length===0){
                $("<li>No things found</li>").appendTo("#node-input-rule-container");
                return;
            }
            var thingTypeList = halGetThingTypes(RED,thingsList,true);

           //Rules
           $("#node-input-rule-container").editableList({
                addItem: function(container,i,opt) {
                    var rule = opt;
                    var savedThing = rule.thing;
                    var savedItem = rule.item;
                    var savedThingType = rule.thingtype;

                    container.css({
                        overflow: 'hidden',
                        whiteSpace: 'nowrap'
                    });

                    //Add rows
                    var rowName = $('<div/>').appendTo(container);
                    var rowTypes = $('<div/>',{style:"margin-top:8px;"})
                        .appendTo(container)
                        .hide()  
                    var rowNotes = $('<div/>',{style:"margin-top:8px;"})
                        .appendTo(container)
                        .hide()                    
                    var rowFilter = $('<div/>',{style:"margin-top:8px;"})
                        .appendTo(container)
                        .hide()
                    var rowItem = $('<div/>',{style:"margin-top:8px;"}).appendTo(container);
                    var rowItemNotes = $('<div/>',{style:"margin-top:8px;"})
                        .appendTo(container)
                        .hide()
                    var rowRule = $('<div/>',{style:"margin-top:8px;"}).appendTo(container);
                    var rowGroupTip = $('<div/>', { class: "form-tips",
                        style: "margin-top:8px; margin-left:90px; width:calc(100% - 110px); box-sizing:border-box; white-space:normal;" })
                        .appendTo(container).hide();

                    //Add labels
                    var labelName = $('<div/>',{style:"display:inline-block;text-align:left; width:80px; padding-right:10px; box-sizing:border-box;",class:"fa fa-microchip"})
                        .appendTo(rowName)
                        .append(' Thing')
                    var labelType = $('<div/>',{style:"display:inline-block;text-align:left; width:80px; padding-right:10px; box-sizing:border-box;",class:"fa fa-gears"})
                        .appendTo(rowTypes)
                        .append(' Type')
                    var labelNotes = $('<div/>',{style:"display:inline-block;text-align:left; width:80px; padding-right:10px; box-sizing:border-box;",class:"fa fa-file"})
                        .appendTo(rowNotes)
                        .append(' Notes')                         
                    var labelFilter = $('<div/>',{style:"display:inline-block;text-align:left; width:80px; padding-right:10px; box-sizing:border-box;",class:"fa fa-filter"})
                        .appendTo(rowFilter)
                        .append(' Filter')
                    var labelItem = $('<div/>',{style:"display:inline-block;text-align:left; width:80px; padding-right:10px; box-sizing:border-box;",class:"fa fa-sitemap"})
                        .appendTo(rowItem)
                        .append(' Item')
                    var labelItemNotes = $('<div/>',{style:"display:inline-block;text-align:left; width:80px; padding-right:10px; box-sizing:border-box;",class:"fa fa-file"})
                        .appendTo(rowItemNotes)
                        .append(' Notes')
                    var labelRule = $('<div/>',{style:"display:inline-block;text-align:left; width:80px; padding-right:10px; box-sizing:border-box;"})
                        .appendTo(rowRule)
                        .append(' Rule')   

                    var thingsField = $('<select/>',{class:"node-input-rule-thing",style:"width:calc(100% - 110px)"}).appendTo(rowName);
                    var typesField = $('<select/>',{class:"node-input-rule-type",style:"width:calc(100% - 110px)"}).appendTo(rowTypes);
                    var notesField = $('<textarea/>',{style:"width:calc(100% - 110px);background-color:#ffe;"}).appendTo(rowNotes);
                    var thingsFilter = $('<button type="button"/>').appendTo(rowName);
                    $('<i/>',{class:"fa fa-filter"}).appendTo(thingsFilter);
                    var filterField = $('<select/>',{style:"width:calc(100% - 110px)"}).appendTo(rowFilter);
                    var itemsField = $('<select/>',{class:"node-input-rule-item",style:"width:calc(100% - 110px)"}).appendTo(rowItem);
                    var itemNotesField = $('<textarea/>',{style:"width:calc(100% - 110px);background-color:#ffe;"}).appendTo(rowItemNotes);

                    var isGroupRule = function() { return groupIds[thingsField.val()] === true; };

                    thingsField.change(function() {
                        var thing;
                        var thingType;
                        // A group has one value and no items, so the item row is what the
                        // group id goes into — the same place a thing's item id would.
                        if (isGroupRule()) {
                            rowTypes.hide(); rowNotes.hide(); rowItem.hide(); rowItemNotes.hide();
                            rowFilter.hide(); thingsFilter.hide();
                            itemsField.children().remove();
                            itemsField.append($("<option></option>").val(thingsField.val()).text(thingsField.val()));
                            itemsField.val(thingsField.val());
                            var g = groupsList.filter(function(x) { return x.id === thingsField.val(); })[0];
                            rowGroupTip.html($('<small/>').text(g
                                ? 'Value: ' + window.hal2GroupAggregate.label(g.aggregate) : ''));
                            rowGroupTip.toggle(!!g);
                            return;
                        }
                        rowGroupTip.hide();
                        rowItem.show();
                        if (thingsField.val() == 'dynamic') {
                            rowTypes.show();
                            rowNotes.hide();
                            thingsFilter.hide();
                            try {
                                thingType = RED.nodes.node(typesField.val());
                            } catch (error) {
                                console.log('Error: '+error.message);
                            } 
                        } else {
                            rowTypes.hide();
                            thingsFilter.show();
                            //get all items and sort them alphabetically
                            try {
                                thing = RED.nodes.node(thingsField.val());
                                thingType = RED.nodes.node(thing.thingType);
                            } catch (error) {
                                console.log('Error: '+error.message);
                            } 
                            // Show notes
                            if (thing.notes) {
                                rowNotes.show();
                                notesField.val(thing.notes);
                            } else {
                                rowNotes.hide();
                            }                            
                        }
                        itemsField.children().remove();

                        //Add items
                        for (let d in thingType.items) {
                            if (halStatusItem(thingType.items[d])) {
                                itemsField.append($("<option></option>").val(thingType.items[d].id).text(thingType.items[d].name));
                            }
                        }

                        if (savedItem != null) {
                            if ((thingsField.val() == 'dynamic') && (typesField.val() == savedThingType) || (thingsField.val() != 'dynamic') && (thingsField.val() == savedThing)) {
                                itemsField.val(savedItem);
                            }
                        }
                        itemsField.trigger('change');
                    });

                    typesField.change(function() { thingsField.trigger('change'); });


                    filterField.change(function() {
                        thingsField.children().remove();
                        for (var d in thingsList) {
                            if ((filterField.val() == 0) || (thingsList[d].thingType == filterField.val())) {
                                thingsField.append($("<option></option>").val(thingsList[d].id).text(thingsList[d].name));
                            }
                        }
                        thingsField.trigger('change');
                    });

                    thingsFilter.on('click', function() {
                        if (rowFilter.is(':visible')) {
                            rowFilter.hide();
                            if (filterField.val() != 0) {
                                filterField.val(0);
                                filterField.trigger('change');
                            }
                        } else {
                            rowFilter.show();
                        }
                    });

                    itemsField.change(function() {
                        rowItemNotes.hide();
                        if (isGroupRule()) { return; }
                        var thing = RED.nodes.node(thingsField.val());
                        var thingType = RED.nodes.node(thing.thingType);
                        var item = itemsField.val();
                        for (let d in thingType.items) {
                            if (thingType.items[d].id == item) {
                                if (thingType.items[d].notes) {
                                    rowItemNotes.show();
                                    itemNotesField.val(thingType.items[d].notes);
                                }
                                break;
                            }
                        }                        
                    });

                    //Add things
                    thingsField.append($("<option></option>").val('dynamic').text('Thing - set by msg.thing.id -'));
                    // Groups sit in the same select as things: a rule reads one value either
                    // way, and the source list stays one list.
                    for (var d in groupsList) {
                        thingsField.append($("<option></option>").val(groupsList[d].id).text('Group - ' + groupsList[d].name));
                    }
                    for (var d in thingsList) {
                        thingsField.append($("<option></option>").val(thingsList[d].id).text(thingsList[d].name));
                    }
                    thingsField.val(thingsList.length ? thingsList[0].id : 'dynamic');
                    

                    //Add thingTypes
                    for (var d in thingTypeList) {
                        typesField.append($("<option></option>").val(thingTypeList[d].id).text(thingTypeList[d].name));
                    }

                    //Add filter types
                    filterField.append($("<option></option>").val(0).text("<All types>"));
                    for (let d in thingTypeList) {
                        filterField.append($("<option></option>").val(thingTypeList[d].id).text(thingTypeList[d].name));
                    }                    

                    //Add operators
                    var operatorField = $('<select/>',{class:"node-input-rule-operator"}).appendTo(rowRule);
                    for (var d in operators) {
                        operatorField.append($("<option></option>").val(operators[d].v).text(operators[d].t));
                    }

                    //Add comparison value field
                    var valueField = $('<input/>',{class:"node-input-rule-value",type:"text"})
                        .appendTo(rowRule)
                        .typedInput({
                            default:'num'
                        });
                    
                    //Show/Hide value field
                    operatorField.change( function() {
                        var type = $(this).children("option:selected").val();
                        if (type.length < 4) {
                            $(this).css({ "width": "50px" });
                            valueField.typedInput('width','calc(100% - 160px)')
                        } else {
                            $(this).css({ "width": "90px" });
                            valueField.typedInput('width','calc(100% - 200px)')

                        }
                        if (type === "true" || type === "false") {
                            valueField.typedInput('hide');
                            $(this).css({ "width": "calc(100% - 110px)" });
                        } else {
                            valueField.typedInput('show');
                        }
                        if (type == "regex" || type == "lt" || type == "lte" || type == "gt" || type == "gte") {
                            if (type == "regex") {
                                valueField.typedInput('types',['re']);
                                valueField.typedInput('type','re');
                            } else {
                                valueField.typedInput('types',['msg','flow','global','num','env']);
                                valueField.typedInput('type',rule.ct);                        
                            }
                        } else if (type == "last_update_gte" || type == "last_update_lte" || type == "last_change_gte" || type == "last_change_lte") {
                            valueField.typedInput('types',['num','msg','flow','global','env']);
                            valueField.typedInput('type',rule.ct);
                        } else {
                            valueField.typedInput('types',['msg','flow','global','str','num','env']);
                            valueField.typedInput('type',rule.ct);
                        }
                    });

                    //Add values
                    if (Object.keys(rule).length !== 0) {
                        thingsField.val(rule.thing);
                        operatorField.val(rule.operator);
                        valueField.typedInput('value',rule.value);
                        valueField.typedInput('type',rule.type);
                        if (typeof rule.thingtype !== 'undefined') { typesField.val(rule.thingtype); }
                    }
                    operatorField.trigger('change');
                    thingsField.trigger('change');
                    itemsField.trigger('change');
                },
                removable: true,
                sortable: true,
                addButton: "Rule"
            });

            //Add rules
            if (this.rules) {
                for (var i=0; i<this.rules.length; i++) {
                    var rule = this.rules[i];
                    if (rule.thing == 'dynamic') {
                        try {
                            let thingtype = RED.nodes.node(rule.thingtype);
                            if (typeof thingtype !== 'undefined') {
                                $("#node-input-rule-container").editableList('addItem',rule);
                            } else {
                                console.error('ThingType ID '+rule.thingtype+' is missing.');
                            }
                        } catch (error) {
                            console.log('Error: '+error.message);
                        }
                    } else if (groupIds[rule.thing]) {
                        $("#node-input-rule-container").editableList('addItem',rule);
                    } else {
                        try {
                            let thing = RED.nodes.node(rule.thing);
                            if (typeof thing !== 'undefined') {
                                $("#node-input-rule-container").editableList('addItem',rule);
                            } else {
                                console.error('Thing ID '+rule.thing+' is missing.');
                            }
                        } catch (error) {
                            console.log('Error: '+error.message);
                        }  
                    }
                }
            } else {
                $("#node-input-rule-container").editableList('addItem',null);              
            }            
        },
        oneditsave: function() {
            var savedGroups = {};
            halGetGroups(RED, $("#node-input-eventHandler").val(), 'value')
                .forEach(function(g) { savedGroups[g.id] = true; });
            var rules = $("#node-input-rule-container").children();
            var ruleset;
            var node = this;
            node.rules= [];

            rules.each(function(i) {
                var rule = $(this);
                var thing = rule.find(".node-input-rule-thing option:selected").val();
                var thingtype = rule.find(".node-input-rule-type option:selected").val();
                var item = rule.find(".node-input-rule-item option:selected").val();
                var operator = rule.find(".node-input-rule-operator option:selected").val();
                var value = rule.find(".node-input-rule-value").typedInput('value');
                var type  = rule.find(".node-input-rule-value").typedInput('type');

                var r = {thing:thing, thingtype:thingtype, item:item, operator:operator, value:value, type:type};
                if (savedGroups[thing]) { r.category = 'hal2Group'; }
                node.rules.push(r);
            });

            // Change mode gate/if
            if ($("#node-input-if").is(":checked")) {
                this.outputs = 1;
            } else {
                this.outputs = 2;
            }
        }
    });
</script>
