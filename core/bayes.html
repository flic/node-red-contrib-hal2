<script type="text/x-red" data-template-name="hal2Bayes">
    <div class="form-row">
        <ul id="hal2bayes-tabs"></ul>
    </div>
    <div id="hal2bayes-tabs-content">

        <div id="hal2bayes-tab-general" style="display:none">
            <div class="form-row">
                <label for="node-input-eventHandler" style="width:130px;"><i class="fa fa-ellipsis-h"></i> Event handler</label>
                <input type="text" id="node-input-eventHandler" style="width:calc(100% - 160px)" placeholder="Event handler">

            <div class="form-row hal2bayes-adv">
                <label for="node-input-topic" style="width:130px;"><i class="fa fa-comment"></i> Topic</label>

            <div class="form-row hal2bayes-adv">
                <label for="node-input-prior" style="width:130px;"><i class="fa fa-balance-scale"></i> Prior</label>

            <div class="form-row hal2bayes-adv">
                <label for="node-input-pOn" style="width:130px;"><i class="fa fa-toggle-on"></i> On threshold</label>

                <label for="node-input-pOff" style="width:110px; margin-left:16px;"><i class="fa fa-toggle-off"></i> Off threshold</label>
                <input type="number" id="node-input-pOff" min="0" max="1" step="any" style="width:80px">
            </div>
            <div class="form-row hal2bayes-adv">
                <label for="node-input-halfLife" style="width:130px;"><i class="fa fa-hourglass-half"></i> Half-life (s)</label>
                <input type="number" id="node-input-halfLife" min="1" step="any" style="width:80px">
            </div>
            <div class="form-row hal2bayes-adv">
                <label for="node-input-clamp" style="width:130px;"><i class="fa fa-compress"></i> Log-odds clamp</label>
                <input type="number" id="node-input-clamp" min="1" max="20" step="any" style="width:80px">
                <label for="node-input-tickInterval" style="width:110px; margin-left:16px;"><i class="fa fa-clock-o"></i> Tick (s)</label>
                <input type="number" id="node-input-tickInterval" min="5" step="any" style="width:80px">

            <div class="form-row hal2bayes-adv">
                <label for="node-input-snapshotOnTick" style="width:auto">
                    <i class="fa fa-camera"></i> Emit snapshot on every tick</label>
                <input type="checkbox" id="node-input-snapshotOnTick" style="display:inline-block; width:auto; vertical-align:top;">
            </div>
            <div class="form-tips hal2bayes-adv">The estimate starts at <b>Prior</b> and is pushed by evidence. The output turns
            on at P &ge; <b>On threshold</b> and off first at P &le; <b>Off threshold</b>, so it does not flap.
            One-off evidence fades with <b>Half-life</b> unless a sensor overrides it.</div>

            <div class="form-row" style="margin-top:18px; border-top:1px solid #ddd; padding-top:12px;">
                <label for="node-input-advanced" style="width:auto"><i class="fa fa-sliders"></i> Advanced mode</label>
                <input type="checkbox" id="node-input-advanced" style="display:inline-block; width:auto; vertical-align:top;">
            </div>
            <div class="form-tips hal2bayes-simple">Advanced mode exposes likelihood ratios, one-off evidence with
            decay, custom sequence rules and the model parameters. Your sensors are kept either way.</div>
        </div>

        <div id="hal2bayes-tab-observations" style="display:none">
            <div class="form-row node-input-observation-container-row">
                <ol id="node-input-observation-container"></ol>
            </div>
            <div class="form-tips hal2bayes-simple">A <b>sensor</b> row is one observation: while its condition holds it
            nudges the estimate. An <b>arrival</b> row is two sensors in time order &mdash; a door opening and closing
            again followed by movement &mdash; which is how you tell someone actually came in rather than just walked
            past. <b>Slight</b> is a weak hint, <b>decisive</b> is near-proof.</div>
            <div class="form-tips hal2bayes-adv"><b>State</b> rows contribute their LR while the condition holds.
            <b>Event</b> rows add a one-shot contribution when the condition becomes true, which then
            decays with the half-life. LR &gt; 1 raises the probability, LR &lt; 1 lowers it, LR = 1 is
            a building block for sequences only. <b>Arrival</b> rows expand into two event rows and a sequence.</div>
        </div>

        <div id="hal2bayes-tab-sequences" style="display:none">
            <div class="form-row node-input-composite-container-row">
                <ol id="node-input-composite-container"></ol>
            </div>
            <div class="form-row" style="margin-top:12px;">
                <label for="node-input-candidateRow" style="width:130px;"><i class="fa fa-user"></i> Candidate trigger</label>
                <select id="node-input-candidateRow" style="width:calc(100% - 160px)"></select>
            </div>
            <div class="form-row">
                <label for="node-input-candidateWindow" style="width:130px;"><i class="fa fa-hourglass-start"></i> Cand. window (s)</label>
                <input type="number" id="node-input-candidateWindow" min="1" step="any" style="width:80px">
            </div>
            <div class="form-tips">A sequence arms on its <b>arm row</b> (edge, or a true&rarr;false cycle within
            the cycle limit) and applies its LR when the <b>confirm row</b> fires within the window.
            Rows flagged <i>only as candidate</i> apply only while the output is off and the
            <b>candidate trigger</b> row fired within the candidate window &mdash; evaluated when the
            sequence arms. A candidate trigger set here overrides an arrival row's person sensor.</div>
        </div>

    </div>
</script>

<script type="text/x-red" data-help-name="hal2Bayes">
    <p>Estimates something you cannot measure directly &mdash; typically <i>"is this person home?"</i> &mdash;
    by weighing up several unreliable sensors instead of trusting any single one. A phone presence
    sensor that already reports "home" from the street corner is not enough on its own; combined with
    the front door opening and movement in the hallway, it becomes convincing. One node estimates one
    thing, so use one node per person.</p>

    <h3>Simple mode</h3>
    <p>Every row on the <b>Sensors</b> tab is a piece of evidence, of one of two kinds.</p>
    <p>A <b>sensor</b> row is a single observation and reads as a sentence: <i>when [sensor] [is true /
    &gt; 20 / &hellip;], that indicates [true/false], [slight&hellip;decisive]</i>. Strength is how much
    the observation should move the estimate &mdash; <b>slight</b> is a weak hint, <b>decisive</b> is
    near-proof. The row keeps contributing for as long as the condition holds.</p>
    <p>An <b>arrival</b> row is two sensors in a time order, which no single observation can express:
    a door opens and closes again, and movement follows. Pick the door sensor, the motion sensor, and
    which sensor row identifies the person. The boost applies only to someone not already on, and only
    if their own sensor was seen shortly before &mdash; so a door cycle with no movement
    (<i>"opened the door, forgot something in the car, closed it"</i>) does not count as arriving, and
    someone leaving is never boosted by their own exit.</p>

    <h3>Advanced mode</h3>
    <p>The checkbox at the bottom of <b>General</b> unlocks the full model: raw likelihood ratios
    (<code>LR = P(observation | true) / P(observation | false)</code>) instead of word strengths,
    <b>event</b> rows whose contribution fades with a half-life, the <i>only as candidate</i> flag,
    custom sequence rules on the <b>Sequences</b> tab, and the model parameters (prior, thresholds,
    clamp, tick). Rows written in advanced mode that have no simple equivalent are shown read-only in
    simple mode &mdash; they are never modified or dropped.</p>
    <p>Internally the estimate is a log-odds sum: it starts at <code>logit(prior)</code>, each active
    observation adds <code>ln(LR)</code>, and one-off evidence decays toward zero. The binary output
    uses two thresholds so it does not flap around a single value. An arrival row is a shorthand: it
    expands into two <code>LR&nbsp;1</code> event rows plus a cycle sequence, exactly what you would
    otherwise build by hand on the Sequences tab.</p>

    <h3>Input</h3>
    <p><code>msg.topic</code>: <code>reset</code> (back to the prior), <code>set</code> (force the output,
    payload true/false), <code>evidence</code> (inject ad-hoc evidence, payload
    <code>{ lr, halfLife? }</code>). Any other message emits a snapshot on output 2.</p>

    <h3>Outputs</h3>
    <p><b>1:</b> on change of the binary result &mdash; <code>payload</code> true/false, <code>probability</code>.
    <b>2:</b> snapshot <code>{ p, logOdds, binary, activeStateRows, terms, fsm }</code> on every
    sensor evaluation (and every tick if enabled). Use output 2 to watch the estimate while tuning.</p>
    <p>To record the result on a Thing, wire output 1 onward like any other message &mdash; the node
    has no side channel into the object model.</p>

    <h3>Notes</h3>
    <p>The estimate is persisted in node context (the event handler's context store), so it survives
    restarts and keeps fading by wall clock while Node-RED is down. The node subscribes once per distinct
    thing; many sensors across many things may require raising the event handler's max listeners.</p>
</script>

<script type="text/javascript">
    (function() {
        // Word strengths ⇄ likelihood ratios. The mapping is bijective, so a row's simple-mode
        // representation is derived from its stored lr — no extra fields are persisted, and
        // toggling modes can never leave a stale label behind.
        var STRENGTHS = [
            { v: 'slight',   t: 'slight',   lr: 1.5 },
            { v: 'moderate', t: 'moderate', lr: 3 },
            { v: 'strong',   t: 'strong',   lr: 10 },
            { v: 'decisive', t: 'decisive', lr: 30 }
        ];

        function lrFor(strength, direction) {
            var s = STRENGTHS.filter(function(x) { return x.v === strength; })[0] || STRENGTHS[1];
            return direction === 'false' ? String(Number((1 / s.lr).toFixed(4))) : String(s.lr);
        }

        // → { strength, direction } when the row is expressible in simple mode, else null.
        // Any operator is fine; what simple mode cannot show is decaying evidence, the
        // candidate flag, or a likelihood ratio that is not one of the four strengths.
        function simpleView(row) {
            if (!row || row.kind === 'arrival') { return null; }
            if (row.type !== 'state') { return null; }
            if (row.halfLife !== '' && row.halfLife !== undefined && row.halfLife !== null) { return null; }
            if (row.onlyAsCandidate === true) { return null; }
            var lr = Number(row.lr);
            if (!(lr > 0) || lr === 1) { return null; }
            var direction = lr > 1 ? 'true' : 'false';
            var mag = lr > 1 ? lr : 1 / lr;
            for (var i = 0; i < STRENGTHS.length; i++) {
                if (Math.abs(mag - STRENGTHS[i].lr) / STRENGTHS[i].lr < 0.01) {
                    return { strength: STRENGTHS[i].v, direction: direction };
                }
            }
            return null;
        }

        RED.nodes.registerType('hal2Bayes', {
            category: 'Home Automation',
            color: '#b3b3ff',
            defaults: {
                eventHandler:    { value: "Event handler", type: "hal2EventHandler", required: true },
                name:            {},
                advanced:        { value: false },
                topic:           { value: "" },
                prior:           { value: 0.2 },
                pOn:             { value: 0.85 },
                pOff:            { value: 0.30, validate: function(v) {
                                       return Number(v) < Number($("#node-input-pOn").val() || this.pOn); } },
                clamp:           { value: 6 },
                halfLife:        { value: 1200 },
                tickInterval:    { value: 30 },
                observations:    { value: [] },
                composites:      { value: [] },
                candidateRow:    { value: "" },
                candidateWindow: { value: 300 },
                snapshotOnTick:  { value: false }
            },
            inputs: 1,
            outputs: 2,
            outputLabels: ["state change", "snapshot"],
            icon: "font-awesome/fa-pie-chart",
            label: function() { return this.name || "bayes"; },
            paletteLabel: "bayes",

            oneditprepare: function() {
                var node = this;
                var thingsList = halGetThings(RED, 'status');

                // Nodes saved before simple mode existed: anything actually configured opens
                // in advanced mode, so its rows are never shown as read-only cards.
                var advanced = (node.advanced === undefined || node.advanced === null)
                    ? ((node.observations || []).length > 0 || (node.composites || []).length > 0)
                    : node.advanced === true;
                $("#node-input-advanced").prop('checked', advanced);

                var tabs = RED.tabs.create({
                    id: 'hal2bayes-tabs',
                    onchange: function(tab) {
                        $('#hal2bayes-tabs-content').children().hide();
                        $('#' + tab.id).show();
                    }
                });
                tabs.addTab({ id: 'hal2bayes-tab-general',      label: 'General' });
                tabs.addTab({ id: 'hal2bayes-tab-observations', label: 'Sensors' });
                tabs.addTab({ id: 'hal2bayes-tab-sequences',    label: 'Sequences' });

                // ── shared helpers ───────────────────────────────────────────
                function thingName(id) {
                    var t = null;
                    try { t = RED.nodes.node(id); } catch (e) {}
                    return t ? (t.name || id) : id;
                }

                function itemName(thingId, itemId) {
                    var thing = null;
                    try { thing = RED.nodes.node(thingId); } catch (e) {}
                    var thingType = thing ? RED.nodes.node(thing.thingType) : null;
                    if (thingType) {
                        for (var d in thingType.items) {
                            if (thingType.items[d].id === itemId) { return thingType.items[d].name; }
                        }
                    }
                    return itemId;
                }

                // Rows have no name of their own — they are identified by what they watch.
                function rowLabel(row) {
                    if (!row) { return ''; }
                    if (row.kind === 'arrival') {
                        return 'Arrival: ' + (row.door && row.door.thing ? thingName(row.door.thing) : '?');
                    }
                    if (!row.thing) { return '(unset sensor)'; }
                    return thingName(row.thing) + ' · ' + itemName(row.thing, row.item);
                }

                function fillThingSelect(sel, current, emptyLabel) {
                    sel.empty();
                    if (emptyLabel !== undefined) { sel.append($("<option></option>").val('').text(emptyLabel)); }
                    for (var t in thingsList) {
                        sel.append($("<option></option>").val(thingsList[t].id).text(thingsList[t].name));
                    }
                    if (current) { sel.val(current); }
                }

                function fillItemSelect(sel, thingId, current, emptyLabel) {
                    sel.empty();
                    if (emptyLabel !== undefined) { sel.append($("<option></option>").val('').text(emptyLabel)); }
                    var thing = null;
                    try { thing = RED.nodes.node(thingId); } catch (e) {}
                    var thingType = thing ? RED.nodes.node(thing.thingType) : null;
                    if (thingType) {
                        for (var d in thingType.items) {
                            if (halStatusItem(thingType.items[d])) {
                                sel.append($("<option></option>").val(thingType.items[d].id).text(thingType.items[d].name));
                            }
                        }
                    }
                    if (current) { sel.val(current); }
                }

                // thing + item picker pair, wired so the item list follows the thing.
                function sensorPicker(parent, saved, thingClass, itemClass) {
                    var thingField = $('<select/>', { class: thingClass, style: "width:calc(100% - 110px)" }).appendTo(parent.thingRow);
                    var itemField = $('<select/>', { class: itemClass, style: "width:calc(100% - 110px)" }).appendTo(parent.itemRow);
                    thingField.change(function() {
                        fillItemSelect(itemField, thingField.val(), (thingField.val() === saved.thing) ? saved.item : null);
                    });
                    fillThingSelect(thingField, saved.thing);
                    thingField.trigger('change');
                    return { thing: thingField, item: itemField };
                }

                var label = function(row, icon, text, width) {
                    return $('<div/>', { style: "display:inline-block;text-align:left; width:" + (width || 90) +
                        "px; padding-right:10px; box-sizing:border-box;", class: icon })
                        .appendTo(row).append(' ' + text);
                };

                function newRowDiv(container, first) {
                    return $('<div/>', first ? {} : { style: "margin-top:8px;" }).appendTo(container);
                }

                // ── observation rows ─────────────────────────────────────────
                // Harvest is shared by oneditsave and the advanced toggle, so switching modes
                // never loses in-progress edits. Read-only advanced rows return their original
                // object verbatim — simple mode never rebuilds fields it did not render.
                function harvestObservations() {
                    var rows = [];
                    $("#node-input-observation-container").children().each(function() {
                        var el = $(this);
                        var original = el.data('row') || {};
                        if (el.data('readonly')) { rows.push(original); return; }

                        if (el.data('kind') === 'arrival') {
                            rows.push($.extend({}, original, {
                                kind: 'arrival',
                                door:   { thing: el.find('.bayes-arr-door-thing option:selected').val(),
                                          item:  el.find('.bayes-arr-door-item option:selected').val() },
                                motion: { thing: el.find('.bayes-arr-motion-thing option:selected').val(),
                                          item:  el.find('.bayes-arr-motion-item option:selected').val() },
                                personRow: el.find('.bayes-arr-person option:selected').val(),
                                lr: el.data('simple')
                                        ? lrFor(el.find('.bayes-arr-strength option:selected').val(), 'true')
                                        : el.find('.bayes-arr-lr').val(),
                                cycleMax:      el.data('simple') ? original.cycleMax : el.find('.bayes-arr-cyclemax').val(),
                                confirmWindow: el.data('simple') ? original.confirmWindow : el.find('.bayes-arr-window').val()
                            }));
                            return;
                        }

                        if (el.data('simple')) {
                            rows.push($.extend({}, original, {
                                kind:      'sensor',
                                thing:     el.find('.bayes-obs-thing option:selected').val(),
                                item:      el.find('.bayes-obs-item option:selected').val(),
                                type:      'state',
                                operator:  el.find('.bayes-obs-operator option:selected').val(),
                                value:     el.find('.bayes-obs-value').typedInput('value'),
                                valueType: el.find('.bayes-obs-value').typedInput('type'),
                                lr:        lrFor(el.find('.bayes-obs-strength option:selected').val(),
                                                 el.find('.bayes-obs-indicates option:selected').val()),
                                halfLife:  '',
                                onlyAsCandidate: false
                            }));
                            return;
                        }

                        rows.push({
                            id:              original.id,
                            kind:            'sensor',
                            thing:           el.find('.bayes-obs-thing option:selected').val(),
                            item:            el.find('.bayes-obs-item option:selected').val(),
                            type:            el.find('.bayes-obs-type option:selected').val(),
                            operator:        el.find('.bayes-obs-operator option:selected').val(),
                            value:           el.find('.bayes-obs-value').typedInput('value'),
                            valueType:       el.find('.bayes-obs-value').typedInput('type'),
                            lr:              el.find('.bayes-obs-lr').val(),
                            halfLife:        el.find('.bayes-obs-halflife').val(),
                            onlyAsCandidate: el.find('.bayes-obs-cand').is(':checked')
                        });
                    });
                    return rows;
                }

                // Sensor rows only — an arrival row cannot identify a person.
                function sensorRowOptions() {
                    return harvestObservations()
                        .filter(function(r) { return r.kind !== 'arrival'; })
                        .map(function(r) { return { id: r.id, name: rowLabel(r) }; });
                }

                function rowRefSelect(sel, currentVal, emptyLabel) {
                    function fill() {
                        var current = sel.val() || currentVal;
                        sel.empty();
                        if (emptyLabel !== undefined) { sel.append($("<option></option>").val('').text(emptyLabel)); }
                        sensorRowOptions().forEach(function(o) {
                            sel.append($("<option></option>").val(o.id).text(o.name));
                        });
                        if (current) { sel.val(current); }
                    }
                    sel.on('focus', fill);
                    fill();
                }

                // Condition operator + value; the value box hides for true/false.
                function conditionFields(parent, row, adv) {
                    var opField = $('<select/>', { class: "bayes-obs-operator", style: "width:110px" }).appendTo(parent);
                    halOperators().forEach(function(o) { opField.append($("<option></option>").val(o.v).text(o.t)); });
                    var valueField = $('<input/>', { class: "bayes-obs-value", type: "text",
                        style: "width:" + (adv ? "calc(100% - 320px)" : "160px") + "; margin-left:6px;" })
                        .appendTo(parent).typedInput({ default: row.valueType || 'str', types: ['str', 'num', 'bool', 're'] });
                    valueField.typedInput('value', row.value === undefined ? '' : row.value);
                    opField.change(function() {
                        var op = opField.val();
                        (op === 'true' || op === 'false') ? valueField.typedInput('hide') : valueField.typedInput('show');
                    });
                    opField.val(row.operator || 'true').trigger('change');
                    return opField;
                }

                function addSimpleSensorRow(container, row, view) {
                    container.data({ row: row, kind: 'sensor', simple: true, readonly: false });
                    container.css({ overflow: 'hidden', whiteSpace: 'nowrap' });

                    var rowThing = newRowDiv(container, true);
                    var rowItem = newRowDiv(container);
                    var rowCond = newRowDiv(container);
                    var rowInd = newRowDiv(container);

                    label(rowThing, 'fa fa-microchip', 'Sensor');
                    label(rowItem, 'fa fa-sitemap', 'Item');
                    sensorPicker({ thingRow: rowThing, itemRow: rowItem }, row, "bayes-obs-thing", "bayes-obs-item");

                    label(rowCond, 'fa fa-question', 'When');
                    conditionFields(rowCond, row, false);

                    label(rowInd, 'fa fa-balance-scale', 'Indicates');
                    var indField = $('<select/>', { class: "bayes-obs-indicates", style: "width:80px" }).appendTo(rowInd);
                    indField.append($("<option></option>").val('true').text('true'));
                    indField.append($("<option></option>").val('false').text('false'));
                    $('<span/>', { style: "margin:0 8px; color:#888;" }).appendTo(rowInd).html('&mdash;');
                    var strField = $('<select/>', { class: "bayes-obs-strength", style: "width:110px" }).appendTo(rowInd);
                    STRENGTHS.forEach(function(s) { strField.append($("<option></option>").val(s.v).text(s.t)); });

                    indField.val(view.direction);
                    strField.val(view.strength);
                }

                function addAdvancedSensorRow(container, row) {
                    container.data({ row: row, kind: 'sensor', simple: false, readonly: false });
                    container.css({ overflow: 'hidden', whiteSpace: 'nowrap' });

                    var rowThing = newRowDiv(container, true);
                    var rowItem = newRowDiv(container);
                    var rowCond = newRowDiv(container);
                    var rowLr = newRowDiv(container);
                    var rowEvent = newRowDiv(container);

                    label(rowThing, 'fa fa-microchip', 'Thing');
                    label(rowItem, 'fa fa-sitemap', 'Item');
                    sensorPicker({ thingRow: rowThing, itemRow: rowItem }, row, "bayes-obs-thing", "bayes-obs-item");

                    label(rowCond, 'fa fa-question', 'Condition');
                    var typeField = $('<select/>', { class: "bayes-obs-type", style: "width:80px; margin-right:6px;" }).appendTo(rowCond);
                    typeField.append($("<option></option>").val('event').text('event'));
                    typeField.append($("<option></option>").val('state').text('state'));
                    conditionFields(rowCond, row, true);

                    label(rowLr, 'fa fa-balance-scale', 'LR');
                    var lrField = $('<input/>', { class: "bayes-obs-lr", type: "number", min: "0.001", step: "any", style: "width:80px" })
                        .appendTo(rowLr).val(row.lr);
                    var hintField = $('<span/>', { style: "margin-left:10px; color:#888; font-size:0.9em;" }).appendTo(rowLr);
                    function lrHint() {
                        var n = Number(lrField.val());
                        hintField.text(n > 0 ? 'P(obs|true)=' + (n / (1 + n)).toFixed(2) +
                            ' / P(obs|false)=' + (1 / (1 + n)).toFixed(2) : '');
                    }
                    lrField.on('input', lrHint);
                    lrHint();

                    label(rowEvent, 'fa fa-hourglass-half', 'Half-life');
                    $('<input/>', { class: "bayes-obs-halflife", type: "number", min: "1", step: "any", placeholder: "default", style: "width:80px" })
                        .appendTo(rowEvent).val(row.halfLife);
                    $('<span/>', { style: "margin-left:4px; color:#888;" }).appendTo(rowEvent).text('s');
                    var candLabel = $('<label/>', { style: "width:auto; margin-left:16px; display:inline-block;" }).appendTo(rowEvent);
                    $('<input/>', { class: "bayes-obs-cand", type: "checkbox", style: "width:auto; vertical-align:middle;" })
                        .appendTo(candLabel).prop('checked', row.onlyAsCandidate === true);
                    candLabel.append(' only as candidate');

                    typeField.change(function() { rowEvent.toggle(typeField.val() === 'event'); });
                    typeField.val(row.type || 'state').trigger('change');
                }

                function addArrivalRow(container, row, adv) {
                    container.data({ row: row, kind: 'arrival', simple: !adv, readonly: false });
                    container.css({ overflow: 'hidden', whiteSpace: 'nowrap' });

                    var head = newRowDiv(container, true);
                    $('<span/>', { class: "fa fa-sign-in", style: "margin-right:8px; color:#888;" }).appendTo(head);
                    $('<b/>').appendTo(head).text('Arrival');
                    $('<span/>', { style: "color:#888; margin-left:8px; font-size:0.9em;" }).appendTo(head)
                        .text('door opens and closes, then movement');

                    var rowDoorT = newRowDiv(container);
                    var rowDoorI = newRowDiv(container);
                    label(rowDoorT, 'fa fa-columns', 'Door');
                    label(rowDoorI, 'fa fa-sitemap', 'Item');
                    sensorPicker({ thingRow: rowDoorT, itemRow: rowDoorI }, row.door || {},
                        "bayes-arr-door-thing", "bayes-arr-door-item");

                    var rowMotT = newRowDiv(container);
                    var rowMotI = newRowDiv(container);
                    label(rowMotT, 'fa fa-child', 'Motion');
                    label(rowMotI, 'fa fa-sitemap', 'Item');
                    sensorPicker({ thingRow: rowMotT, itemRow: rowMotI }, row.motion || {},
                        "bayes-arr-motion-thing", "bayes-arr-motion-item");

                    var rowPerson = newRowDiv(container);
                    label(rowPerson, 'fa fa-user', 'Person');
                    var personField = $('<select/>', { class: "bayes-arr-person", style: "width:calc(100% - 110px)" }).appendTo(rowPerson);
                    rowRefSelect(personField, row.personRow, 'anyone');

                    var rowStr = newRowDiv(container);
                    if (adv) {
                        label(rowStr, 'fa fa-balance-scale', 'LR');
                        $('<input/>', { class: "bayes-arr-lr", type: "number", min: "0.001", step: "any", style: "width:80px" })
                            .appendTo(rowStr).val(row.lr === undefined ? 30 : row.lr);
                        $('<span/>', { style: "margin-left:16px; color:#888;" }).appendTo(rowStr).text('cycle max');
                        $('<input/>', { class: "bayes-arr-cyclemax", type: "number", min: "1", step: "any", style: "width:70px; margin-left:6px;" })
                            .appendTo(rowStr).val(row.cycleMax === undefined ? 180 : row.cycleMax);
                        $('<span/>', { style: "margin-left:12px; color:#888;" }).appendTo(rowStr).text('confirm within');
                        $('<input/>', { class: "bayes-arr-window", type: "number", min: "1", step: "any", style: "width:70px; margin-left:6px;" })
                            .appendTo(rowStr).val(row.confirmWindow === undefined ? 120 : row.confirmWindow);
                        $('<span/>', { style: "margin-left:4px; color:#888;" }).appendTo(rowStr).text('s');
                    } else {
                        label(rowStr, 'fa fa-balance-scale', 'Strength');
                        var strField = $('<select/>', { class: "bayes-arr-strength", style: "width:110px" }).appendTo(rowStr);
                        STRENGTHS.forEach(function(s) { strField.append($("<option></option>").val(s.v).text(s.t)); });
                        var view = simpleView({ type: 'state', lr: row.lr === undefined ? 30 : row.lr, halfLife: '' });
                        strField.val(view ? view.strength : 'decisive');
                    }
                }

                function addReadonlyRow(container, row) {
                    container.data({ row: row, kind: 'sensor', simple: false, readonly: true });
                    container.css({ overflow: 'hidden', whiteSpace: 'nowrap', opacity: 0.75 });
                    $('<div/>').appendTo(container)
                        .append($('<span/>', { class: "fa fa-lock", style: "margin-right:8px; color:#888;" }))
                        .append($('<b/>').text(rowLabel(row)));
                    $('<div/>', { style: "margin-top:4px; color:#888; font-size:0.9em;" }).appendTo(container)
                        .text('Advanced row (' + (row.type || 'state') + ', LR ' + row.lr + ') — enable advanced mode to edit');
                }

                $("#node-input-observation-container").editableList({
                    addItem: function(container, i, opt) {
                        var adv = $("#node-input-advanced").is(':checked');
                        var row = opt && opt.id ? opt : { id: halCreateId(), kind: 'sensor', thing: '', item: '',
                            type: 'state', operator: 'true', value: '', valueType: 'str',
                            lr: '3', halfLife: '', onlyAsCandidate: false };
                        if (row.kind === 'arrival') { return addArrivalRow(container, row, adv); }
                        if (adv) { return addAdvancedSensorRow(container, row); }
                        var view = simpleView(row);
                        return view ? addSimpleSensorRow(container, row, view) : addReadonlyRow(container, row);
                    },
                    removable: true,
                    sortable: true,
                    height: 'auto',
                    addButton: "sensor",
                    // editableList supports extra add buttons alongside its own.
                    buttons: [{
                        label: "arrival",
                        icon: "fa fa-sign-in",
                        title: "add an arrival rule (door + motion in time order)",
                        click: function() {
                            $("#node-input-observation-container").editableList('addItem', {
                                id: halCreateId(), kind: 'arrival', door: {}, motion: {},
                                personRow: '', lr: 30, cycleMax: 180, confirmWindow: 120
                            });
                        }
                    }]
                });

                function renderObservations(rows) {
                    $("#node-input-observation-container").editableList('empty');
                    (rows || []).forEach(function(row) {
                        $("#node-input-observation-container").editableList('addItem', row);
                    });
                }

                // Pre-2.7 configs kept a single arrival as node.entry — fold it into a row.
                var initialRows = (node.observations || []).slice();
                if (node.entry && node.entry.door && node.entry.motion &&
                    !initialRows.some(function(r) { return r.kind === 'arrival'; })) {
                    initialRows.push({ id: halCreateId(), kind: 'arrival', door: node.entry.door,
                        motion: node.entry.motion, personRow: node.entry.personRow || '',
                        lr: 30, cycleMax: 180, confirmWindow: 120 });
                }
                renderObservations(initialRows);

                // ── sequences (advanced only) ────────────────────────────────
                $("#node-input-composite-container").editableList({
                    addItem: function(container, i, opt) {
                        var comp = opt && opt.id ? opt : { id: halCreateId(), name: '', armRow: '', armPattern: 'cycle',
                            cycleMax: 180, confirmRow: '', confirmWindow: 120, confirmDuringArm: true,
                            lr: 30, onlyAsCandidate: true };
                        container.data('compId', comp.id);
                        container.css({ overflow: 'hidden', whiteSpace: 'nowrap' });

                        var rowHead = newRowDiv(container, true);
                        var rowArm = newRowDiv(container);
                        var rowPattern = newRowDiv(container);
                        var rowConfirm = newRowDiv(container);
                        var rowWindow = newRowDiv(container);
                        var rowLr = newRowDiv(container);

                        // Sequences have no name of their own — like sensor rows they are
                        // identified by what they watch, derived live from the two selects.
                        $('<span/>', { class: "fa fa-code-fork", style: "margin-right:8px; color:#888;" }).appendTo(rowHead);
                        var headText = $('<b/>').appendTo(rowHead);

                        label(rowArm, 'fa fa-play', 'Arm row');
                        var armField = $('<select/>', { class: "bayes-comp-arm", style: "width:calc(100% - 110px)" }).appendTo(rowArm);

                        label(rowPattern, 'fa fa-retweet', 'Pattern');
                        var patternField = $('<select/>', { class: "bayes-comp-pattern", style: "width:100px" }).appendTo(rowPattern);
                        patternField.append($("<option></option>").val('cycle').text('cycle'));
                        patternField.append($("<option></option>").val('edge').text('edge'));
                        var cycleSpan = $('<span/>').appendTo(rowPattern);
                        cycleSpan.append($('<span/>', { style: "margin-left:10px; color:#888;" }).text('max '));
                        $('<input/>', { class: "bayes-comp-cyclemax", type: "number", min: "1", step: "any", style: "width:70px" })
                            .appendTo(cycleSpan).val(comp.cycleMax);
                        cycleSpan.append($('<span/>', { style: "margin-left:4px; color:#888;" }).text('s'));

                        label(rowConfirm, 'fa fa-check', 'Confirm row');
                        var confirmField = $('<select/>', { class: "bayes-comp-confirm", style: "width:calc(100% - 110px)" }).appendTo(rowConfirm);

                        label(rowWindow, 'fa fa-hourglass', 'Window');
                        $('<input/>', { class: "bayes-comp-window", type: "number", min: "1", step: "any", style: "width:70px" })
                            .appendTo(rowWindow).val(comp.confirmWindow);
                        rowWindow.append($('<span/>', { style: "margin-left:4px; color:#888;" }).text('s'));
                        var duringLabel = $('<label/>', { style: "width:auto; margin-left:16px; display:inline-block;" }).appendTo(rowWindow);
                        $('<input/>', { class: "bayes-comp-during", type: "checkbox", style: "width:auto; vertical-align:middle;" })
                            .appendTo(duringLabel).prop('checked', comp.confirmDuringArm !== false);
                        duringLabel.append(' confirm during arm');

                        label(rowLr, 'fa fa-balance-scale', 'LR');
                        $('<input/>', { class: "bayes-comp-lr", type: "number", min: "0.001", step: "any", style: "width:80px" })
                            .appendTo(rowLr).val(comp.lr);
                        var candLabel = $('<label/>', { style: "width:auto; margin-left:16px; display:inline-block;" }).appendTo(rowLr);
                        $('<input/>', { class: "bayes-comp-cand", type: "checkbox", style: "width:auto; vertical-align:middle;" })
                            .appendTo(candLabel).prop('checked', comp.onlyAsCandidate === true);
                        candLabel.append(' only as candidate');

                        function refreshHead() {
                            var a = armField.find('option:selected').text() || '?';
                            var c = confirmField.find('option:selected').text() || '?';
                            headText.text(a + ' → ' + c);
                        }
                        patternField.change(function() { cycleSpan.toggle(patternField.val() === 'cycle'); });
                        rowRefSelect(armField, comp.armRow);
                        rowRefSelect(confirmField, comp.confirmRow);
                        armField.change(refreshHead);
                        confirmField.change(refreshHead);
                        refreshHead();
                        patternField.val(comp.armPattern).trigger('change');
                    },
                    removable: true,
                    sortable: true,
                    height: 'auto',
                    addButton: "Sequence"
                });
                (node.composites || []).forEach(function(comp) {
                    $("#node-input-composite-container").editableList('addItem', comp);
                });

                rowRefSelect($("#node-input-candidateRow"), node.candidateRow, 'none');

                // ── mode switching ───────────────────────────────────────────
                function applyMode() {
                    var adv = $("#node-input-advanced").is(':checked');
                    $('.hal2bayes-adv').toggle(adv);
                    $('.hal2bayes-simple').toggle(!adv);
                    // RED.tabs names the <li> "red-ui-tab-<tab id>".
                    $('#red-ui-tab-hal2bayes-tab-sequences').toggle(adv);
                    if (!adv && $('#hal2bayes-tab-sequences').is(':visible')) { tabs.activateTab('hal2bayes-tab-general'); }
                }
                $("#node-input-advanced").change(function() {
                    // Re-render rows in the other representation, keeping current edits.
                    renderObservations(harvestObservations());
                    applyMode();
                });
                applyMode();

                // Expose the harvester so oneditsave uses exactly the same logic.
                node.__harvestObservations = harvestObservations;
            },

            oneditsave: function() {
                var node = this;
                node.observations = node.__harvestObservations ? node.__harvestObservations() : (node.observations || []);
                delete node.__harvestObservations;
                // The pre-2.7 `entry` field is not in defaults, so it drops out of the flow
                // on save; oneditprepare has already folded it into an arrival row.

                var rowIds = {};
                node.observations.forEach(function(r) { rowIds[r.id] = true; });

                node.composites = [];
                $("#node-input-composite-container").children().each(function(index) {
                    var el = $(this);
                    var comp = {
                        id:               el.data('compId'),
                        armRow:           el.find('.bayes-comp-arm option:selected').val(),
                        armPattern:       el.find('.bayes-comp-pattern option:selected').val(),
                        cycleMax:         el.find('.bayes-comp-cyclemax').val(),
                        confirmRow:       el.find('.bayes-comp-confirm option:selected').val(),
                        confirmWindow:    el.find('.bayes-comp-window').val(),
                        confirmDuringArm: el.find('.bayes-comp-during').is(':checked'),
                        lr:               el.find('.bayes-comp-lr').val(),
                        onlyAsCandidate:  el.find('.bayes-comp-cand').is(':checked')
                    };
                    if (!rowIds[comp.armRow] || !rowIds[comp.confirmRow]) {
                        RED.notify("hal2Bayes: sequence " + (index + 1) + " dropped — it references a removed sensor", "warning");
                        return;
                    }
                    node.composites.push(comp);
                });

                // Drop a stale candidate reference in the DOM — Node-RED harvests the select
                // value after oneditsave, so assigning node.candidateRow here would be overwritten.
                var candSel = $("#node-input-candidateRow");
                if (candSel.val() && !rowIds[candSel.val()]) { candSel.val(''); }
            }
        });
    })();
</script>
