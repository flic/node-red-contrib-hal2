            <div class="form-row hal2bayes-adv" style="margin-top:14px;">

            <div class="form-row hal2bayes-adv">

                <label for="node-input-pOff" style="width:110px; margin-left:16px;"><i class="fa fa-toggle-off"></i> Off threshold</label>

                <label for="node-input-halfLife" style="width:130px;"><i class="fa fa-hourglass-half"></i> Half-life (s)</label>
                <input type="number" id="node-input-halfLife" min="1" step="any" style="width:80px">
                <label for="node-input-clamp" style="width:110px; margin-left:16px;"><i class="fa fa-compress"></i> Clamp</label>

            <div class="form-row hal2bayes-adv">
                <label for="node-input-tickInterval" style="width:130px;"><i class="fa fa-clock-o"></i> Tick (s)</label>
                <input type="number" id="node-input-tickInterval" min="5" step="any" style="width:80px">
                <label for="node-input-snapshotOnTick" style="width:auto; margin-left:16px;">
                    <i class="fa fa-camera"></i> Snapshot every tick</label>
                <input type="checkbox" id="node-input-snapshotOnTick" style="display:inline-block; width:auto; vertical-align:top;">
            </div>
            <div class="form-tips hal2bayes-adv">The estimate starts at <b>Prior</b> and is pushed by rules.
            The output turns on at P &ge; <b>On threshold</b> and off first at P &le; <b>Off threshold</b>.
            Momentary evidence fades with <b>Half-life</b> unless a rule overrides it.</div>

            <div class="form-row" style="margin-top:18px; border-top:1px solid #ddd; padding-top:12px;">
                <label for="node-input-advanced" style="width:auto"><i class="fa fa-sliders"></i> Advanced mode</label>
                <input type="checkbox" id="node-input-advanced" style="display:inline-block; width:auto; vertical-align:top;">
            </div>
            <div class="form-tips hal2bayes-simple">Advanced mode exposes raw likelihood ratios, half-lives
            and the model parameters. Your rules are kept either way.</div>
        </div>

        <div id="hal2bayes-tab-rules" style="display:none">
            <div class="form-row node-input-rule-container-row">
                <ol id="node-input-rule-container"></ol>
            </div>
            <div id="hal2bayes-summary" class="form-tips" style="margin-top:8px;"></div>
        </div>

<script type="text/x-red" data-help-name="hal2Bayes">
    <p>Estimates something you cannot measure directly &mdash; typically <i>"is this person home?"</i> &mdash;
    by weighing up several unreliable sensors instead of trusting any single one. A phone presence
    sensor that already reports "home" from the street corner is not enough on its own; combined with
    the front door opening and closing and movement in the hallway, it becomes convincing. One node
    estimates one thing, so use one node per person.</p>

    <h3>Rules</h3>
    <p>Everything is a <b>rule</b>, built from steps. A step is one of three kinds:</p>
    <ul>
        <li><b>is</b> &mdash; a condition, checked at that instant. Reads <i>and&hellip;</i></li>
        <li><b>becomes</b> &mdash; an event: the condition changes to true. Reads <i>then&hellip;</i></li>
        <li><b>goes on then off</b> &mdash; a cycle: true and back to false within the limit, e.g. a
            door opening and closing. Reads <i>then&hellip;</i></li>
    </ul>
    <p>A rule that is a single <b>is</b> step is <b>continuous</b> (reads <i>While&hellip;</i>): it pushes
    the estimate while its condition holds and stops the moment it does not. Any other rule is
    <b>momentary</b> (<i>When&hellip;then&hellip;</i>): the steps must happen in order, each event within
    its time window, and completing the last step gives a one-off push that then fades. An event that
    happened while the previous step was still in progress also counts &mdash; motion while the door
    stood open is accepted when it closes.</p>
    <p><b>Put the event first and the conditions after.</b> Trigger on the thing that actually happens
    at a point in time &mdash; usually a door &mdash; and use <b>is</b> steps to ask what was true at that
    moment: <i>"When the front door goes on then off, and iPhone Fredrik is true &rarr; makes it true"</i>.
    Written that way the rule does not care whether the phone appeared thirty seconds or thirty minutes
    earlier, and it never fires for somebody else's arrival, because their phone is not here. A step that
    needs the change itself &mdash; leaving &mdash; uses <b>becomes</b>:
    <i>"When the front door goes on then off, then iPhone Fredrik becomes false within 5 min &rarr;
    makes it false, certain"</i>.</p>

    <h3>Strengths and the share scale</h3>
    <p>Each rule pushes with a strength: <b>slight</b> (LR 1.5), <b>moderate</b> (3), <b>strong</b> (10),
    <b>decisive</b> (30) or <b>certain</b> (400), toward true or toward false. The editor shows every
    rule as a <i>share of the way</i> from the prior to the on-threshold &mdash; and shares add up
    exactly, so 74&nbsp;% + 35&nbsp;% = 109&nbsp;% turns the output on. Rules below 100&nbsp;% cannot
    turn it on alone; that is how shared sensors (a door everyone uses) are kept from triggering the
    wrong node &mdash; give them a share that only crosses the line together with the node's own
    strong indicator. A <b>certain</b> rule overrides accumulated history: when it fires it clears
    opposing evidence, and a stored certain statement is cleared by any later contradicting rule.</p>

    <h3>Fading and the latch</h3>
    <p>Momentary pushes fade &mdash; <b>quick</b> (5 min half-life), <b>normal</b> (20 min) or
    <b>slow</b> (1 h). Continuous rules never fade; they simply stop when their condition does.
    By default the output falls back to off when evidence disappears. The <b>lock</b> on the General
    tab changes that: <i>only rules that make it false can turn it off</i> &mdash; silence, decay or a
    sensor dropping out will not (the status shows <code>held</code>). Use it when the state cannot end
    unnoticed: nobody can leave the house without the door opening. The optional hour limit turns it
    off anyway after that long without supporting evidence.</p>

    <h3>Input</h3>
    <p><code>msg.topic</code>: <code>reset</code> (back to the prior), <code>evidence</code>
    (inject ad-hoc evidence, payload <code>{ lr, halfLife? }</code>). Any other message emits a
    snapshot on output 2.</p>

    <h3>Outputs</h3>
    <p><b>1:</b> on change of the binary result &mdash; <code>payload</code> true/false,
    <code>probability</code>. <b>2:</b> snapshot
    <code>{ p, logOdds, binary, held, activeRules, terms, fsm }</code> on every sensor evaluation
    (and every tick if enabled). Wire output 1 onward like any other message to record the result on
    a Thing &mdash; the node has no side channel into the object model.</p>

    <h3>Notes</h3>
    <p>The estimate is persisted in node context (the event handler's context store), so it survives
    restarts and keeps fading by wall clock while Node-RED is down. The node subscribes once per
    distinct thing; many sensors across many things may require raising the event handler's max
    listeners.</p>
</script>

<script type="text/javascript">
    (function() {
        var scale = window.hal2BayesScale;

        RED.nodes.registerType('hal2Bayes', {
            category: 'Home Automation',
            color: '#b3b3ff',
            defaults: {
                eventHandler:   { value: "Event handler", type: "hal2EventHandler", required: true },
                name:           {},
                advanced:       { value: false },
                topic:          { value: "" },
                prior:          { value: 0.2 },
                pOn:            { value: 0.85 },
                pOff:           { value: 0.30, validate: function(v) {
                                      return Number(v) < Number($("#node-input-pOn").val() || this.pOn); } },
                clamp:          { value: 6 },
                halfLife:       { value: 1200 },
                tickInterval:   { value: 30 },
                rules:          { value: [] },
                latch:          { value: false },
                maxHold:        { value: "" },
                snapshotOnTick: { value: false }
            },
            inputs: 1,
            outputs: 2,
            outputLabels: ["state change", "snapshot"],
            icon: "font-awesome/fa-pie-chart",
            label: function() { return this.name || "bayes"; },
            paletteLabel: "bayes",

            oneditprepare: function() {
                var node = this;
                var thingsList = halGetThings(RED, 'status');

                var tabs = RED.tabs.create({
                    id: 'hal2bayes-tabs',
                    onchange: function(tab) {
                        $('#hal2bayes-tabs-content').children().hide();
                        $('#' + tab.id).show();
                    }
                });
                tabs.addTab({ id: 'hal2bayes-tab-general', label: 'General' });
                tabs.addTab({ id: 'hal2bayes-tab-rules',   label: 'Rules' });

                // ── shared helpers ───────────────────────────────────────────
                function fillThingSelect(sel, current) {
                    sel.empty();
                    sel.append($("<option></option>").val('').text('select…'));
                    for (var t in thingsList) {
                        sel.append($("<option></option>").val(thingsList[t].id).text(thingsList[t].name));
                    }
                    if (current) { sel.val(current); }
                }

                function fillItemSelect(sel, thingId, current) {
                    sel.empty();
                    var thing = null;
                    try { thing = RED.nodes.node(thingId); } catch (e) {}
                    var thingType = thing ? RED.nodes.node(thing.thingType) : null;
                    if (thingType) {
                        for (var d in thingType.items) {
                            if (halStatusItem(thingType.items[d])) {
                                sel.append($("<option></option>").val(thingType.items[d].id).text(thingType.items[d].name));
                            }
                        }
                    }
                    if (current) { sel.val(current); }
                }

                // Current model parameters (advanced fields double as the source of truth).
                function params() {
                    return {
                        prior: Number($("#node-input-prior").val()) || 0.2,
                        pOn:   Number($("#node-input-pOn").val()) || 0.85,
                        pOff:  Number($("#node-input-pOff").val()) || 0.30,
                        clamp: Number($("#node-input-clamp").val()) || 6,
                        halfLifeS: Number($("#node-input-halfLife").val()) || 1200
                    };
                }

                // Effective LR of a harvested rule (direction applied).
                function effectiveLr(rule) {
                    var lr = Number(rule.lr) > 0 ? Number(rule.lr) : scale.strengthLr(rule.strength);
                    return rule.direction === 'false' ? 1 / lr : lr;
                }

                function isContinuous(rule) {
                    // A lone level check is the continuous case: "while X is true".
                    return rule.steps.length === 1 && rule.steps[0].pattern === 'is';
                }

                function ruleHalfLifeS(rule) {
                    return Number(rule.halfLife) > 0 ? Number(rule.halfLife) : scale.fadeSeconds(rule.fade);
                }

                function pct(x) { return Math.round(x * 100); }

                function fmtDuration(ms) {
                    if (ms === null) { return null; }
                    var min = ms / 60e3;
                    if (min < 90) { return '~' + Math.max(1, Math.round(min)) + ' min'; }
                    return '~' + (min / 60).toFixed(1).replace(/\.0$/, '') + ' h';
                }

                // ── step row ─────────────────────────────────────────────────
                function addStepRow(stepsDiv, ruleContainer, step) {
                    var row = $('<div/>', { class: "bayes-step", style: "margin-top:6px; white-space:nowrap;" }).appendTo(stepsDiv);

                    $('<span/>', { class: "bs-lead", style: "display:inline-block; width:50px; font-weight:bold;" }).appendTo(row);

                    var thingSel = $('<select/>', { class: "bs-thing", style: "width:150px;" }).appendTo(row);
                    var itemSel = $('<select/>', { class: "bs-item", style: "width:120px; margin-left:4px;" }).appendTo(row);

                    var opSel = $('<select/>', { class: "bs-op", style: "width:90px; margin-left:4px;" }).appendTo(row);
                    halOperators().forEach(function(o) { opSel.append($("<option></option>").val(o.v).text(o.t)); });
                    var valField = $('<input/>', { class: "bs-val", type: "text", style: "width:110px; margin-left:4px;" })
                        .appendTo(row).typedInput({ default: step.valueType || 'str', types: ['str', 'num', 'bool', 're'] });
                    valField.typedInput('value', step.value === undefined ? '' : step.value);

                    var patSel = $('<select/>', { class: "bs-pattern", style: "width:150px; margin-left:4px;" }).appendTo(row);
                    patSel.append($("<option></option>").val('is').text('is (right now)'));
                    patSel.append($("<option></option>").val('becomes').text('becomes (changes to)'));
                    patSel.append($("<option></option>").val('cycle').text('goes on then off'));

                    var cycleSpan = $('<span/>', { class: "bs-cycle-span" }).appendTo(row);
                    $('<span/>', { style: "margin-left:6px; color:#888;" }).appendTo(cycleSpan).text('open ≤');
                    $('<input/>', { class: "bs-cyclemax", type: "number", min: "1", step: "any", style: "width:60px; margin-left:4px;" })
                        .appendTo(cycleSpan).val(step.cycleMax === undefined ? 180 : step.cycleMax);
                    $('<span/>', { style: "margin-left:2px; color:#888;" }).appendTo(cycleSpan).text('s');

                    var windowSpan = $('<span/>', { class: "bs-window-span" }).appendTo(row);
                    $('<span/>', { style: "margin-left:6px; color:#888;" }).appendTo(windowSpan).text('within');
                    $('<input/>', { class: "bs-window", type: "number", min: "1", step: "any", style: "width:60px; margin-left:4px;" })
                        .appendTo(windowSpan).val(step.window === undefined ? 120 : step.window);
                    $('<span/>', { style: "margin-left:2px; color:#888;" }).appendTo(windowSpan).text('s');

                    var removeBtn = $('<button type="button" class="red-ui-button red-ui-button-small bs-remove" style="margin-left:6px;"><i class="fa fa-remove"></i></button>')
                        .appendTo(row)
                        .on('click', function(e) {
                            e.preventDefault();
                            row.remove();
                            refreshRuleView(ruleContainer);
                        });

                    thingSel.change(function() {
                        fillItemSelect(itemSel, thingSel.val(), (thingSel.val() === step.thing) ? step.item : null);
                    });
                    var opHandler = function() {
                        var op = opSel.val();
                        (op === 'true' || op === 'false') ? valField.typedInput('hide') : valField.typedInput('show');
                    };
                    opSel.change(opHandler);

                    fillThingSelect(thingSel, step.thing);
                    thingSel.trigger('change');
                    opSel.val(step.operator || 'true');
                    opHandler();
                    patSel.val(step.pattern || 'is');
                    return row;
                }

                // Harvest one rule item from its DOM.
                function harvestRule(container) {
                    var rule = {
                        id: container.data('ruleId'),
                        steps: [],
                        direction: container.find('.br-direction option:selected').val(),
                        strength: container.find('.br-strength option:selected').val(),
                        fade: container.find('.br-fade option:selected').val(),
                        lr: container.find('.br-lr').val(),
                        halfLife: container.find('.br-halflife').val()
                    };
                    container.find('.bayes-step').each(function() {
                        var el = $(this);
                        rule.steps.push({
                            thing:    el.find('.bs-thing option:selected').val(),
                            item:     el.find('.bs-item option:selected').val(),
                            operator: el.find('.bs-op option:selected').val(),
                            value:    el.find('.bs-val').typedInput('value'),
                            valueType: el.find('.bs-val').typedInput('type'),
                            pattern:  el.find('.bs-pattern option:selected').val(),
                            cycleMax: el.find('.bs-cyclemax').val(),
                            window:   el.find('.bs-window').val()
                        });
                    });
                    return rule;
                }

                // Recompute the lead words, field visibility, bar and captions of one rule.
                function refreshRuleView(container) {
                    var rule = harvestRule(container);
                    var cont = isContinuous(rule);
                    var p = params();

                    container.find('.bayes-step').each(function(i) {
                        var el = $(this);
                        var pat = el.find('.bs-pattern').val();
                        // A level check reads "and …" — it is a condition, not an event.
                        el.find('.bs-lead').text(i === 0 ? (cont ? 'While' : 'When') : (pat === 'is' ? 'and' : 'then'));
                        el.find('.bs-cycle-span').toggle(pat === 'cycle');
                        el.find('.bs-window-span').toggle(i > 0 && pat !== 'is');
                        el.find('.bs-remove').toggle(rule.steps.length > 1);
                    });

                    // A level check cannot start a sequence — nothing would trigger it.
                    var deadTrigger = rule.steps.length > 1 && rule.steps[0].pattern === 'is';
                    container.find('.br-warning')
                        .text(deadTrigger ? 'The first step is a condition, so nothing triggers this rule — make it "becomes" or "goes on then off".' : '')
                        .toggle(deadTrigger);

                    var lr = effectiveLr(rule);
                    var share = scale.shareOfWay(lr, p.prior, p.pOn, p.clamp);
                    var sPct = pct(share);

                    var bar = container.find('.br-bar-inner');
                    bar.css({ width: Math.min(100, Math.abs(share) * 100) + '%',
                              background: share >= 0 ? '#4b8' : '#c66' });

                    var capt = sPct >= 0
                        ? sPct + ' % of the way to on' + (share >= 1 ? ' — enough on its own' : '')
                        : sPct + ' % (pushes toward off)';
                    container.find('.br-share-caption').text(capt);

                    var custom = Number(rule.lr) > 0;
                    container.find('.br-strength').prop('disabled', custom)
                        .attr('title', custom ? 'overridden by the raw LR field' : '');

                    var decay;
                    if (cont) {
                        decay = 'holds while true';
                    } else {
                        var hlMin = ruleHalfLifeS(rule) / 60;
                        decay = Math.abs(sPct) + ' % now → ' + Math.abs(Math.round(sPct / 2)) + ' % after ' +
                                Math.round(hlMin) + ' min → ' + Math.abs(Math.round(sPct / 4)) + ' % after ' +
                                Math.round(2 * hlMin) + ' min';
                    }
                    container.find('.br-decay-caption').text(decay);
                    container.find('.br-fade-span').toggle(!cont);
                    container.find('.br-halflife-span').toggle(!cont);

                    refreshSummary();
                }

                function refreshAllRules() {
                    $("#node-input-rule-container").children().each(function() { refreshRuleView($(this)); });
                }

                // ── summary under the list ───────────────────────────────────
                function refreshSummary() {
                    var p = params();
                    var totalPos = 0, anyAlone = false, momentaryTerms = [];
                    $("#node-input-rule-container").children().each(function() {
                        var rule = harvestRule($(this));
                        if (!rule.steps.length || !rule.steps[0].thing) { return; }
                        var lr = effectiveLr(rule);
                        var share = scale.shareOfWay(lr, p.prior, p.pOn, p.clamp);
                        if (share > 0) {
                            totalPos += share;
                            if (share >= 1) { anyAlone = true; }
                            if (!isContinuous(rule)) {
                                momentaryTerms.push({ l0: Math.log(lr), halfLifeMs: ruleHalfLifeS(rule) * 1000 });
                            }
                        }
                    });

                    var lines = [];
                    lines.push('<b>Together: ' + pct(totalPos) + ' %</b> → ' +
                        (totalPos >= 1 ? 'turns on.' : 'not enough to turn on.') + ' ' +
                        (anyAlone ? 'At least one rule is enough on its own.' : 'No single rule is enough on its own.'));

                    if ($("#node-input-latch").is(':checked')) {
                        var hold = $("#node-input-maxHold").val();
                        lines.push('Once on, the output stays on until a "makes it false" rule fires' +
                            (Number(hold) > 0 ? ' (or after ' + hold + ' h without supporting evidence).' : '.'));
                    } else {
                        var ms = scale.offAfterMs(momentaryTerms, p.prior, p.pOff, p.clamp);
                        lines.push(ms === null
                            ? 'The resting state never falls below the off-threshold.'
                            : (ms === 0
                                ? 'If all evidence stops, the output turns off immediately.'
                                : 'If all evidence stops now, the output turns off after ' + fmtDuration(ms) + '.'));
                    }
                    $("#hal2bayes-summary").html(lines.join('<br>'));
                }

                // ── rule list ────────────────────────────────────────────────
                $("#node-input-rule-container").editableList({
                    addItem: function(container, i, opt) {
                        var rule = opt && opt.id ? opt : {
                            id: halCreateId(),
                            steps: [{ thing: '', item: '', operator: 'true', value: '', valueType: 'str',
                                      pattern: 'is', cycleMax: 180, window: 120 }],
                            direction: 'true', strength: 'moderate', fade: 'normal', lr: '', halfLife: ''
                        };
                        container.data('ruleId', rule.id);
                        container.css({ overflow: 'hidden' });

                        var stepsDiv = $('<div/>', { class: "bayes-steps" }).appendTo(container);
                        (rule.steps || []).forEach(function(s) { addStepRow(stepsDiv, container, s); });

                        $('<button type="button" class="red-ui-button red-ui-button-small" style="margin-top:6px; margin-left:50px;"><i class="fa fa-plus"></i> step</button>')
                            .appendTo(container)
                            .on('click', function(e) {
                                e.preventDefault();
                                addStepRow(stepsDiv, container, { operator: 'true', pattern: 'is', cycleMax: 180, window: 120 });
                                refreshRuleView(container);
                            });

                        var outRow = $('<div/>', { style: "margin-top:8px; white-space:nowrap;" }).appendTo(container);
                        $('<span/>', { style: "display:inline-block; width:50px; color:#888;" }).appendTo(outRow).text('→');
                        $('<span/>', { style: "margin-right:6px;" }).appendTo(outRow).text('makes it');
                        var dirSel = $('<select/>', { class: "br-direction", style: "width:70px;" }).appendTo(outRow);
                        dirSel.append($("<option></option>").val('true').text('true'));
                        dirSel.append($("<option></option>").val('false').text('false'));
                        var strSel = $('<select/>', { class: "br-strength", style: "width:100px; margin-left:6px;" }).appendTo(outRow);
                        scale.STRENGTHS.forEach(function(s) { strSel.append($("<option></option>").val(s.v).text(s.v)); });
                        var fadeSpan = $('<span/>', { class: "br-fade-span" }).appendTo(outRow);
                        $('<span/>', { style: "margin-left:10px; color:#888;" }).appendTo(fadeSpan).text('fades');
                        var fadeSel = $('<select/>', { class: "br-fade", style: "width:90px; margin-left:4px;" }).appendTo(fadeSpan);
                        scale.FADES.forEach(function(f) { fadeSel.append($("<option></option>").val(f.v).text(f.v)); });

                        var advRow = $('<div/>', { class: "hal2bayes-adv", style: "margin-top:6px; white-space:nowrap;" }).appendTo(container);
                        $('<span/>', { style: "display:inline-block; width:50px;" }).appendTo(advRow);
                        $('<span/>', { style: "color:#888;" }).appendTo(advRow).text('LR');
                        $('<input/>', { class: "br-lr", type: "number", min: "0.001", step: "any", placeholder: "auto", style: "width:80px; margin-left:4px;" })
                            .appendTo(advRow).val(rule.lr);
                        var hlSpan = $('<span/>', { class: "br-halflife-span" }).appendTo(advRow);
                        $('<span/>', { style: "margin-left:12px; color:#888;" }).appendTo(hlSpan).text('half-life');
                        $('<input/>', { class: "br-halflife", type: "number", min: "1", step: "any", placeholder: "auto", style: "width:80px; margin-left:4px;" })
                            .appendTo(hlSpan).val(rule.halfLife);
                        $('<span/>', { style: "margin-left:2px; color:#888;" }).appendTo(hlSpan).text('s');

                        var barRow = $('<div/>', { style: "margin-top:6px; white-space:nowrap;" }).appendTo(container);
                        $('<span/>', { style: "display:inline-block; width:50px;" }).appendTo(barRow);
                        var barOuter = $('<span/>', { class: "br-bar-outer",
                            style: "display:inline-block; width:120px; height:10px; border:1px solid #bbb; border-radius:3px; vertical-align:middle; overflow:hidden;" }).appendTo(barRow);
                        $('<span/>', { class: "br-bar-inner", style: "display:block; height:100%;" }).appendTo(barOuter);
                        $('<span/>', { class: "br-share-caption", style: "margin-left:8px; color:#555;" }).appendTo(barRow);

                        var decayRow = $('<div/>', { style: "margin-top:2px; white-space:nowrap;" }).appendTo(container);
                        $('<span/>', { style: "display:inline-block; width:50px;" }).appendTo(decayRow);
                        $('<span/>', { class: "br-decay-caption", style: "color:#999; font-size:0.9em;" }).appendTo(decayRow);

                        var warnRow = $('<div/>', { style: "margin-top:2px;" }).appendTo(container);
                        $('<span/>', { style: "display:inline-block; width:50px;" }).appendTo(warnRow);
                        $('<span/>', { class: "br-warning", style: "color:#a60; font-size:0.9em;" }).appendTo(warnRow).hide();

                        dirSel.val(rule.direction || 'true');
                        strSel.val(rule.strength || 'moderate');
                        fadeSel.val(rule.fade || 'normal');

                        container.on('change input', function() { refreshRuleView(container); });
                        refreshRuleView(container);
                        $('.hal2bayes-adv', container).toggle($("#node-input-advanced").is(':checked'));
                    },
                    removable: true,
                    sortable: true,
                    height: 'auto',
                    addButton: "rule"
                });
                (node.rules || []).forEach(function(rule) {
                    $("#node-input-rule-container").editableList('addItem', rule);
                });
                // Removing a rule must update the summary too.
                $("#node-input-rule-container").on('click', '.red-ui-editableList-item-remove', function() {
                    setTimeout(refreshSummary, 0);
                });

                // ── mode switching + live recompute ──────────────────────────
                function applyMode() {
                    var adv = $("#node-input-advanced").is(':checked');
                    $('.hal2bayes-adv').toggle(adv);
                    $('.hal2bayes-simple').toggle(!adv);
                    refreshAllRules();   // fade/half-life spans depend on visibility state
                }
                $("#node-input-advanced").change(applyMode);
                applyMode();

                $("#node-input-prior, #node-input-pOn, #node-input-pOff, #node-input-clamp, #node-input-halfLife, #node-input-latch, #node-input-maxHold")
                    .on('change input', refreshAllRules);
            },

            oneditsave: function() {
                var node = this;
                node.rules = [];
                $("#node-input-rule-container").children().each(function() {
                    var el = $(this);
                    var rule = {
                        id: el.data('ruleId'),
                        steps: [],
                        direction: el.find('.br-direction option:selected').val(),
                        strength: el.find('.br-strength option:selected').val(),
                        fade: el.find('.br-fade option:selected').val(),
                        lr: el.find('.br-lr').val(),
                        halfLife: el.find('.br-halflife').val()
                    };
                    el.find('.bayes-step').each(function() {
                        var s = $(this);
                        rule.steps.push({
                            thing:     s.find('.bs-thing option:selected').val(),
                            item:      s.find('.bs-item option:selected').val(),
                            operator:  s.find('.bs-op option:selected').val(),
                            value:     s.find('.bs-val').typedInput('value'),
                            valueType: s.find('.bs-val').typedInput('type'),
                            pattern:   s.find('.bs-pattern option:selected').val(),
                            cycleMax:  s.find('.bs-cyclemax').val(),
                            window:    s.find('.bs-window').val()
                        });
                    });
                    node.rules.push(rule);
                });
            }
        });
    })();
</script>
