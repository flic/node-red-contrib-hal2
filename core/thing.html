<script type="text/x-red" data-template-name="hal2Thing">
    <div class="form-row">
        <label for="node-input-eventHandler" style="width:95px; padding-right:10px;"><i class="fa fa-ellipsis-h"></i> Event handler</label>
        <input type="text" id="node-input-eventHandler" style="width:calc(100% - 125px)" placeholder="Event handler">
    </div>
    <div class="form-row">
        <label for="node-input-thingType" style="width:95px; padding-right:10px;"><i class="fa fa-bookmark"></i> Type</label>
        <input type="text" id="node-input-thingType" style="width:calc(100% - 125px)" placeholder="Type">
    </div>
    <div class="form-row">
        <label for="node-input-topicFilterMode" style="width:95px; padding-right:10px;"><i class="fa fa-filter"></i> Filters</label>
        <select id="node-input-topicFilterMode" style="width:70px; vertical-align:top; margin-top:3px;">
            <option value="and">AND</option>
            <option value="or">OR</option>
        </select>
    </div>
    <div class="form-row">
        <ol id="thing-filter-list"></ol>
    </div>
    <div class="form-row">
        <label for="node-input-topicPrefix" style="width:95px; padding-right:10px;"><i class="fa fa-tasks"></i> Topic</label>
        <input type="text" id="node-input-topicPrefix" style="width:calc(100% - 170px)">
    </div>
    <div class="form-row">
        <label for="node-input-name" style="width:95px; padding-right:10px;"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" style="width:calc(100% - 170px)">
        <button id="info"><i class="fa fa-info-circle"></i></button>
    </div>
    <div class="form-row">
        <label for="node-input-notes" style="width:95px; padding-right:10px;"><i class="fa fa-file"></i> Notes</label>
        <textarea id="node-input-notes" style="width:calc(100% - 170px)"></textarea>
    </div>
    <div class="form-row">
        <label for="node-input-tags" style="width:95px; padding-right:10px;"><i class="fa fa-tags"></i> Tags</label>
        <input type="text" id="node-input-tags" placeholder="comma,separated,tags" style="width:calc(100% - 170px)">
    </div>
    <div class="form-row" id="attributes"  style="width:100%" hidden>
        <label><i class="fa fa-tags"></i> Attributes</label>
        <ol id="attributes-list"></ol>
    </div>
    <div class="form-row" id="thing-groups" style="width:100%">
        <label><i class="fa fa-object-group"></i> Items</label>
        <div id="thing-facts-header" style="width:100%; box-sizing:border-box; padding:0 8px 4px 8px; color:#888; font-size:0.85em; white-space:nowrap;"><span style="display:inline-block; width:14px;"></span><span style="display:inline-block; width:calc(40% - 14px);">Item</span><span style="display:inline-block; width:24%;">Counts as</span><span style="display:inline-block; width:36%;">Device class</span></div>
        <div id="thing-facts-container" style="width:100%; box-sizing:border-box; border:1px solid #ddd; border-radius:3px;"></div>
    </div>
    <div class="form-row" id="thing-metadata" style="width:100%" hidden>
        <label style="display:block; width:auto;">
            <i class="fa fa-info-circle"></i> Metadata
            <button type="button" id="thing-metadata-clear" class="red-ui-button red-ui-button-small" style="float:right;" title="Delete all metadata for this Thing"><i class="fa fa-trash-o"></i> Clear all</button>
        </label>
        <div id="thing-metadata-table" style="width:100%; box-sizing:border-box; border:1px solid #ddd; border-radius:3px; background:#f7f7f7;"></div>
    </div>
    <div class="form-row" id="thing-store" style="width:100%" hidden>
        <label style="display:block; width:auto;">
            <i class="fa fa-database"></i> Function store
            <button type="button" id="thing-store-clear" class="red-ui-button red-ui-button-small" style="float:right;" title="Delete everything this Thing's functions have stored"><i class="fa fa-trash-o"></i> Clear all</button>
        </label>
        <div id="thing-store-table" style="width:100%; box-sizing:border-box; border:1px solid #ddd; border-radius:3px; background:#f7f7f7;"></div>
    </div>
</script>

<script type="text/x-red" data-help-name="hal2Thing">
    <p>The Thing node is a virtual representation of a physical device, like a switch or a sensor. The Thing <i>type</i> defines the functions of the device as a list of <i>items</i> where each item corresponds to a specific measurement or command. For example: a <i>sensor<i> Thing Type might have a temperature-item and a humidity-item. A <i>switch</i> Thing Type might have a relay0 and a relay1 item. It can be queried by the <i>Value</i>, <i>Gate</i> and <i>Action</i> nodes and can trigger an event using <i>Event</i> nodes.</p>
    <li><strong>Event handler</strong>: Used for firing events between nodes. Use the same config for all nodes that should be able to communicate.</li>
    <li><strong>Topic filter</strong>: If configured, this parameter must match <code>msg.topic</code> on the incoming message. If not, the message is dropped. <i>Topic filter</i> can be a text string, a regex expression or an MQTT-formatted topic with + and # wildcards.</li>
    <li><strong>Topic</strong>: Used for filtering and creating item specific command topics. Will become <code>msg.topic</code> for outgoing messages.</li>
    <li><strong>Name</strong>: Node name, used to select the Thing in <i>Value</i>, <i>Gate</i>, <i>Action</i> and <i>Event</i> nodes.</li>    
    <li><strong>Notes</strong>: Thing specific notes. Exposed to MCP clients to help them understand what the device does.</li>
    <li><strong>Tags</strong>: Comma-separated keywords (e.g. "outdoor, lake, dock"). Also exposed to MCP clients for filtering and semantic context.</li>
</script>

<script type="text/javascript">
    RED.nodes.registerType('hal2Thing', {
        category: 'Home Automation',
        color: '#b3b3ff',
        defaults: {
            eventHandler: {
                value: "Event handler",
                type: "hal2EventHandler",
                required: true
            },
            thingType: {
                value: "Type",
                type: "hal2ThingType",
                required: true
            },
            name:           { 
                required: true, 
                validate:function(v) {
                    //Check for name collisions
                    const thingsList = RED.nodes.filterNodes({type: "hal2Thing"});
                    if(thingsList.length===0){ return true; }
                    for (var d in thingsList) {
                        if (v == thingsList[d].name && thingsList[d].id !== this.id) { return false; }
                    }
                    return true;
                }
            },
            attributes:         {},
            topicFilters:       { value: [] },
            topicFilterMode:    { value: 'and' },
            topicFilter:        {},
            topicFilterType:    {},
            topicPrefix:        { value: "" },
            notes:              {},
            tags:               { value: '' },
            groups:             { value: [] }, //[{ item, group }] group membership
            itemFacts:          { value: [] }, //[{ item, kind, value }] per-item facts about this Thing's wiring
            outputs:            { value: 0 } //Store if outputs are enabled
        },
        inputs: 1,
        outputs: 1,
        icon: "thing.png",
        label: function () {
            return this.name || "thing";
        },
        paletteLabel: "thing",
        oneditprepare: function () {
            var node = this;
            $("#node-input-tags").val(Array.isArray(node.tags) ? node.tags.join(', ') : (node.tags || ''));
            // Show "AND" rather than a blank select when the stored value is empty.
            if (!$("#node-input-topicFilterMode").val()) { $("#node-input-topicFilterMode").val("and"); }

            // Two read-only key/value panels over runtime context, both fetched from an admin
            // endpoint because the edit dialog only sees config: Metadata (machine-managed facts
            // like model or ipv6, written by an integration) and the function store (scratch state
            // written by the ThingType's own functions). The user can delete a single key or clear
            // all — note that an active source or function will simply write deleted keys back.
            (function () {
                if (!node.id || (typeof node.isDirty === 'function' && node.id.indexOf('_ADD_') === 0)) { return; }

                function kvPanel(opts) {
                    var base = 'hal2/thing/' + node.id + '/' + opts.route;

                    function load() {
                        $.getJSON(base, function (res) {
                            var bag = (res && res[opts.prop]) || {};
                            var keys = Object.keys(bag).sort();
                            var $t = $(opts.table).empty();
                            if (!keys.length) { $(opts.row).prop('hidden', true); return; }
                            keys.forEach(function (k) {
                                var v = bag[k];
                                if (v && typeof v === 'object') { try { v = JSON.stringify(v); } catch (e) { v = String(v); } }
                                var $row = $('<div/>', { style: 'display:flex; align-items:center; padding:3px 8px; border-bottom:1px solid #eee;' });
                                $('<div/>', { text: k, style: 'flex:0 0 32%; color:#888; font-family:monospace;' }).appendTo($row);
                                $('<div/>', { text: (v === undefined || v === null) ? '' : String(v), style: 'flex:1 1 auto; font-family:monospace; word-break:break-all;' }).appendTo($row);
                                $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small', title: 'Delete this key', style: 'flex:0 0 auto; margin-left:6px;' })
                                    .html('<i class="fa fa-times"></i>')
                                    .on('click', function () { delKey(k); }).appendTo($row);
                                $row.appendTo($t);
                            });
                            $(opts.row).prop('hidden', false);
                        });
                    }

                    function delKey(k) {
                        $.ajax({ url: base + '/' + encodeURIComponent(k), method: 'DELETE' })
                            .done(load)
                            .fail(function () { RED.notify('Failed to delete ' + opts.label + ' key "' + k + '"', 'error'); });
                    }

                    $(opts.clear).on('click', function () {
                        if (!confirm(opts.confirm)) { return; }
                        $.ajax({ url: base, method: 'DELETE' })
                            .done(load)
                            .fail(function () { RED.notify('Failed to clear ' + opts.label, 'error'); });
                    });

                    load();
                }

                kvPanel({ route: 'metadata', prop: 'metadata', label: 'metadata',
                          row: '#thing-metadata', table: '#thing-metadata-table', clear: '#thing-metadata-clear',
                          confirm: 'Delete all metadata for this Thing?' });
                kvPanel({ route: 'store', prop: 'store', label: 'store',
                          row: '#thing-store', table: '#thing-store-table', clear: '#thing-store-clear',
                          confirm: "Delete everything this Thing's functions have stored?" });
            })();
            var typeMQTT = halTypeMQTT();
            var StrStartType   = { value: "StrStart",   label: "starts with", hasValue: true };
            var StrEndType     = { value: "StrEnd",     label: "ends with",   hasValue: true };
            var StrContainsType= { value: "StrContain", label: "contains",    hasValue: true };

            // Incoming filter list
            $('#thing-filter-list').editableList({
                addItem: function(container, i, filter) {
                    var row = $('<div/>').appendTo(container);
                    var fieldInput = $('<input/>', {type:'text', class:'thing-filter-field', style:'width:160px; margin-right:5px;'}).appendTo(row);
                    fieldInput.typedInput({ types: ['msg'] });
                    fieldInput.typedInput('value', filter.field || 'topic');

                    var matchInput = $('<input/>', {type:'text', class:'thing-filter-match', style:'width:calc(100% - 175px)'}).appendTo(row);
                    matchInput.typedInput({ default:'mqtt', types:['str','re',typeMQTT,StrStartType,StrEndType,StrContainsType] });
                    if (filter.matchType) {
                        matchInput.typedInput('type', filter.matchType);
                        matchInput.typedInput('value', filter.value || '');
                    }
                },
                removable: true,
                sortable: false,
                addButton: 'Add filter'
            });

            // Load existing filters — migrate old single-filter format if needed
            var filters = this.topicFilters;
            if ((!filters || filters.length === 0) && this.topicFilter) {
                filters = [{ field: 'topic', matchType: this.topicFilterType || 'mqtt', value: this.topicFilter }];
            }
            if (filters && filters.length > 0) {
                var list = $('#thing-filter-list');
                filters.forEach(function(f) { list.editableList('addItem', f); });
            }

            //Outgoing topic
            if (this.topicPrefix) {
                $("#node-input-topicPrefix").val(this.topicPrefix);                         
            }

            //Attributes list
            $("#attributes-list").editableList({
                addItem: function(container,i,opt) {
                    var attribute = opt;
                    container.css({
                        overflow: 'hidden',
                        whiteSpace: 'nowrap'
                    });

                    var rowAttrName = $('<div/>').appendTo(container);
                    var rowNotes = $('<div/>',{style:"margin-top:8px;"})
                        .appendTo(container)
                        .hide()

                    var labelAttrName = $('<div/>',{style:"display:inline-block;text-align:left; width:102px; padding-right:10px; box-sizing:border-box;",class:"fa fa-tag"})
                        .appendTo(rowAttrName)
                        .append(' '+attribute.name)
                    var labelNotes = $('<div/>',{style:"display:inline-block;text-align:left; width:102px; padding-right:10px; box-sizing:border-box;",class:"fa fa-file"})
                        .appendTo(rowNotes)
                        .append(' Notes') 

                    var valueProperty = $('<input/>',{style: "padding-right:10px; width: calc(100% - 158px)",class:"attribute-value-property",type:"text"})
                        .appendTo(rowAttrName)
                        .prop('required',attribute.required)
                        .val(attribute.val)
                    var idProperty = $('<input/>',{class:"attribute-id-property",type:"hidden"})
                        .appendTo(rowAttrName)
                        .val(attribute.id)
                    var notesField = $('<textarea/>',{style:"width:calc(100% - 158px); background-color:#ffe;"})
                        .appendTo(rowNotes)
                        .val(attribute.notes)
                    if (attribute.notes) {
                        rowNotes.show();
                    }
                },
                removable: false,
                sortable: false,
                addButton: false
            });

            $("#node-input-thingType").change( function () {
                let thingType = RED.nodes.node($("#node-input-thingType").val());
                if (typeof thingType == 'undefined') { return; }

                // Attributes
                $('#attributes').hide();
                if ((typeof thingType.attributes === 'object') && (Object.keys(thingType.attributes).length != 0)) {
                    //Show attribute list and add attribute values
                    $('#attributes-list').editableList('empty');
                    $("#attributes").show();
                    for (let d in thingType.attributes) {
                        let attribute = [];
                        attribute.id = thingType.attributes[d].id;
                        attribute.name = thingType.attributes[d].name;
                        attribute.required = thingType.attributes[d].required;
                        attribute.notes = thingType.attributes[d].notes;
                        attribute.val = "";
                        if ((typeof node.attributes === 'object') && (Object.keys(node.attributes).length != 0)) {
                            for (let a in node.attributes) {
                                if (thingType.attributes[d].id == node.attributes[a].id) {
                                    attribute.val = node.attributes[a].val;
                                    break;
                                }
                            }
                        }
                        $("#attributes-list").editableList('addItem',attribute);
                    }
                }
            });

            // ── Items ─────────────────────────────────────────────────────────
            // EVERY item of the Thing type is listed, always, whether or not anything has been
            // said about it. That is the point: the question this section answers is "what does
            // this item present as", and a list you have to add a row to before it tells you
            // anything cannot answer it — you would have to open the Thing type to find out what
            // the default was, which is exactly the detour to be avoided.
            //
            // Each item is a header row carrying its own device class, with its group memberships
            // collapsed beneath it. Device class is one control per item rather than a repeatable
            // row, so an item cannot end up declared twice.
            function thingFactItems() {
                var tt = RED.nodes.node($("#node-input-thingType").val());
                return (tt && Array.isArray(tt.items)) ? tt.items.filter(function(it) { return it.id !== '1'; }) : [];
            }
            function thingFactGroups() {
                var eh = RED.nodes.node($("#node-input-eventHandler").val());
                return (eh && Array.isArray(eh.groups)) ? eh.groups : [];
            }

            function renderThingFacts() {
                var container = $("#thing-facts-container").empty();
                var items = thingFactItems();
                var groups = thingFactGroups();
                var classes = (Array.isArray(node.itemFacts) ? node.itemFacts : [])
                    .filter(function(f) { return f && f.kind === 'device_class'; });
                var memberships = Array.isArray(node.groups) ? node.groups : [];

                if (items.length === 0) {
                    container.append($('<div/>', { style: "padding:8px; color:#888;" })
                        .text('Choose a Thing type to see its items.'));
                    return;
                }

                items.forEach(function(it, idx) {
                    var haType = it.haType || '';
                    var mine = memberships.filter(function(m) { return m.item === it.id; });
                    var declared = (classes.find(function(c) { return c.item === it.id; }) || {}).value || '';

                    var block = $('<div/>', {
                        class: "thing-fact-item",
                        style: "padding:6px 8px;" + (idx ? " border-top:1px solid #eee;" : "")
                    }).appendTo(container);
                    block.data('item', it.id);

                    var head = $('<div/>', { style: "white-space:nowrap; overflow:hidden;" }).appendTo(block);
                    var toggle = $('<span/>', {
                        class: "thing-fact-toggle",
                        style: "display:inline-block; width:14px; cursor:pointer; color:#888;"
                    }).appendTo(head);
                    $('<span/>', { style: "display:inline-block; width:calc(40% - 14px); overflow:hidden; text-overflow:ellipsis; vertical-align:middle;" })
                        .text(it.name + (haType ? ' (' + haType + ')' : ''))
                        .appendTo(head);

                    // Read-only, and separate from the control on purpose. It states what the
                    // item counts as when the device is categorised — which is all the rule
                    // claims — rather than dressing it up as a value someone chose or must
                    // change. Blank where nothing counts, so a switch that still needs an
                    // answer reads as the gap it is.
                    // box-sizing on both, or the select's own border and padding push it past its
                    // 36% and over the text to its left.
                    var counts = $('<span/>', {
                        class: "thing-fact-counts",
                        style: "display:inline-block; box-sizing:border-box; width:24%; padding-right:8px;"
                             + " overflow:hidden; text-overflow:ellipsis; color:#888;"
                             + " font-size:0.85em; vertical-align:middle;"
                    }).appendTo(head);

                    // The control appears only where the ha_type leaves the question open, which
                    // in practice means a switch: a light, dimmer, cover or fan item already says
                    // what it is. Offering it everywhere made the exceptional case look like the
                    // norm and invited values that do nothing. The read-only column above stays on
                    // every row regardless — that is what answers "what does this item present as".
                    // …or where one is already stored. An item whose ha_type answers the question
                    // has no business carrying a declaration, but hiding one that exists would drop
                    // it on the next Done, silently — the same failure the group rows were just
                    // fixed for. Show it, so it can be seen and removed on purpose.
                    var classSel = null;
                    if (hal2DeviceClass.needsDeviceClass(haType) || declared) {
                        classSel = $('<select/>', {
                            class: "thing-fact-class",
                            style: "box-sizing:border-box; width:36%; vertical-align:middle;"
                        }).appendTo(head);
                        classSel.append($("<option></option>").val('').text('— none —'));
                        hal2DeviceClass.DEVICE_CLASSES.forEach(function(c) {
                            classSel.append($("<option></option>").val(c).text(c));
                        });
                        classSel.val(declared);
                    }

                    function paintCounts() {
                        var c = hal2DeviceClass.countsAs(classSel ? classSel.val() : declared, haType);
                        counts.text(c ? 'counts as ' + c : '');
                    }
                    if (classSel) {
                        classSel.change(function() {
                            paintCounts();
                            // A class change can make a membership contradict its group — declare a
                            // socket and "all lights" no longer accepts it. Redraw the rows so the
                            // marking appears now, keeping whatever each row currently holds.
                            if (typeof repaintGroups === 'function') { repaintGroups(); }
                        });
                    }
                    paintCounts();

                    var body = $('<div/>', {
                        class: "thing-fact-groups",
                        style: "padding:2px 0 2px 14px;"
                    }).appendTo(block);

                    function addGroupRow(selected) {
                        var row = $('<div/>', { style: "margin-top:2px; white-space:nowrap;" }).appendTo(groupRows);
                        var sel = $('<select/>', { class: "thing-fact-group", style: "width:calc(100% - 30px);" }).appendTo(row);
                        // The declared class, live from the control, so changing it re-evaluates
                        // straight away rather than at the next time the dialog is opened.
                        var cls = classSel ? classSel.val() : declared;
                        var compatible = groups.filter(function(g) { return halGroupAccepts(g.haType, haType, cls); });

                        // A stored membership whose group no longer accepts this item has to stay
                        // in the list, selected and marked. Leave it out and .val() finds nothing
                        // to select, the row reads back empty, and the membership is deleted on
                        // Done with nothing said — the failure is invisible precisely when it is
                        // most likely, since tightening what a group accepts is what makes an
                        // existing pairing incompatible in the first place.
                        var stored = selected ? groups.find(function(g) { return g.id === selected; }) : null;
                        var listed = compatible.slice();
                        var orphan = stored && !compatible.some(function(g) { return g.id === stored.id; });
                        if (orphan) { listed.push(stored); }

                        if (listed.length === 0) {
                            // Nothing this item could join. If it was in a group that has since
                            // been deleted, say so rather than showing an empty row: the value is
                            // going to be dropped either way, and silence is what hid it before.
                            sel.append($("<option></option>").val('')
                                .text(selected ? '— group removed —' : '— no compatible group —'));
                        } else {
                            listed.forEach(function(g) {
                                var label = g.name + ' (' + (g.haType === 'other' ? 'mixed' : g.haType) + ')';
                                if (orphan && g.id === stored.id) { label += ' — incompatible'; }
                                sel.append($("<option></option>").val(g.id).text(label));
                            });
                            if (selected && !stored) {
                                // The group is gone entirely; nothing to preserve, but show it.
                                sel.append($("<option></option>").val('').text('— group removed —'));
                                sel.val('');
                            } else if (selected) {
                                sel.val(selected);
                            }
                        }
                        $('<button/>', {
                            type: 'button', class: "red-ui-button red-ui-button-small",
                            style: "margin-left:4px;", title: "Remove"
                        }).html('<i class="fa fa-times"></i>').click(function() { row.remove(); }).appendTo(row);
                    }

                    var groupRows = $('<div/>').appendTo(body);
                    function repaintGroups() {
                        var held = [];
                        groupRows.find('.thing-fact-group').each(function() { held.push($(this).val()); });
                        groupRows.empty();
                        held.forEach(function(v) { addGroupRow(v); });
                    }
                    mine.forEach(function(m) { addGroupRow(m.group); });
                    $('<a/>', { href: "#", style: "font-size:0.85em;" })
                        .text('+ Add group')
                        .click(function(e) { e.preventDefault(); addGroupRow(null); })
                        .appendTo(body);

                    // Closed to begin with, always. The header carries the class, which is the
                    // fact you scan for, and a Thing type with a dozen items should open as a
                    // list you can take in at once rather than a page of expanded group rows.
                    var open = false;
                    function paint() {
                        toggle.html('<i class="fa fa-angle-' + (open ? 'down' : 'right') + '"></i>');
                        body.toggle(open);
                    }
                    toggle.click(function() { open = !open; paint(); });
                    paint();
                });
            }

            renderThingFacts();

            // The item list comes from the Thing type, so switching type must redraw it —
            // otherwise the blocks describe items the Thing no longer has.
            $("#node-input-thingType").change(renderThingFacts);
            $("#node-input-eventHandler").change(renderThingFacts);

            $("#node-input-thingType").trigger('change');

            $('#info').click(function() {
                let message = '<font size=+1>Included in</font><br><table style="border-collapse: separate;border-spacing: 10px;"><tr><th style="text-align: left;">Type</th><th style="text-align: left;">Name</th><th style="text-align: left;">Workspace</th></tr>';
                try {
                    let actions = RED.nodes.filterNodes({type: "hal2Action"});
                    for (let i in actions) {
                        let action = RED.nodes.node(actions[i].id);
                        for (let c in action.commandset) {
                            if ((action.commandset[c].category == 'hal2Thing') && (action.commandset[c].thing == node.id)) {
                                let workspace = RED.nodes.workspace(action.z);
                                message += '<tr><td><b>Action</b></td><td>'+action.name+'</td><td>'+workspace.label+'</td></tr>';
                                break;
                            }
                        }
                    }

                    let events = RED.nodes.filterNodes({type: "hal2Event"});
                    for (let i in events) {
                        let event = RED.nodes.node(events[i].id);
                        if ((event.typeSel == 'hal2Thing') && (event.thing == node.id)) {
                            let workspace = RED.nodes.workspace(event.z);
                            message += '<tr><td><b>Event</b></td><td>'+event.name+'</td><td>'+workspace.label+'</td></tr>';
                            break;
                        }
                    }

                    let gates = RED.nodes.filterNodes({type: "hal2Gate"});
                    for (let i in gates) {
                        let gate = RED.nodes.node(gates[i].id);
                        for (let c in gate.rules) {
                            if (gate.rules[c].thing == node.id) {
                                let workspace = RED.nodes.workspace(gate.z);
                                message += '<tr><td><b>Gate</b></td><td>'+gate.name+'</td><td>'+workspace.label+'</td></tr>';
                                break;
                            }
                        }
                    }

                    let eh = RED.nodes.node(node.eventHandler);
                    let ehGroups = (eh && Array.isArray(eh.groups)) ? eh.groups : [];
                    let myGroupIds = new Set((Array.isArray(node.groups) ? node.groups : []).map(m => m.group));
                    for (let g of ehGroups) {
                        if (myGroupIds.has(g.id)) {
                            message += '<tr><td><b>Group</b></td><td>'+g.name+'</td><td>Event handler</td></tr>';
                        }
                    }

                    let values = RED.nodes.filterNodes({type: "hal2Value"});
                    for (let i in values) {
                        let value = RED.nodes.node(values[i].id);
                        if (value.thing == node.id) {
                            let workspace = RED.nodes.workspace(value.z);
                            message += '<tr><td><b>Value</b></td><td>'+value.name+'</td><td>'+workspace.label+'</td></tr>';
                            break;
                        }
                    }
                    message += '</table>'
                }  catch (error) {
                        console.log('Error: '+error.message);
                }
                RED.notify(message,{ timeout: 10000 });
            });
        },
        oneditsave: function () {
            var node = this;

            node.tags = halParseTags($("#node-input-tags").val());

            // The item blocks separate back into two stores: group membership keeps the shape the
            // group engine has read since 2.7.0, and only the new kinds go to itemFacts. Reading
            // per block is also what keeps one item from carrying two device classes — there is
            // one select to read, not a list of rows to reconcile.
            node.groups = [];
            node.itemFacts = [];
            $("#thing-facts-container .thing-fact-item").each(function() {
                var block = $(this);
                var item = block.data('item');
                if (!item) { return; }
                var cls = block.find('.thing-fact-class').val();
                if (cls) {
                    node.itemFacts.push({ item: item, kind: 'device_class', value: cls });
                }
                block.find('.thing-fact-group').each(function() {
                    var g = $(this).val();
                    if (g) { node.groups.push({ item: item, group: g }); }
                });
            });

            node.topicFilters = [];
            $('#thing-filter-list').editableList('items').each(function() {
                var item = $(this);
                node.topicFilters.push({
                    field:     item.find('.thing-filter-field').typedInput('value'),
                    matchType: item.find('.thing-filter-match').typedInput('type'),
                    value:     item.find('.thing-filter-match').typedInput('value')
                });
            });
            node.topicFilter = '';
            node.topicFilterType = '';

            let TT = $("#node-input-thingType").val();
            if (TT) {
                var thingType = RED.nodes.node(TT);
                if (typeof thingType.thingOutput == 'undefined') { thingType.thingOutput = thingType.thingCommand; }
                if (typeof thingType.outputs == 'undefined') { thingType.outputs = 1; }
                if (thingType.thingOutput) {
                    this.outputs = thingType.outputs;
                } else {
                    this.outputs = 0;
                }
            }

            node.attributes = [];
            $("#attributes-list")
                .editableList('items')
                .each(function() {
                    let item = $(this);
                    let r = {
                        id:item.find(".attribute-id-property").val(),
                        val:item.find(".attribute-value-property").val()
                    }
                    node.attributes.push(r);
                })
        }
    });
</script>
